<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>릴레이소설공포증 😱</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f0f12;
      color: #e1e1e6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    @keyframes terrorFlash {
      0% { background-color: #0f0f12; }
      50% { background-color: #7f1d1d; }
      100% { background-color: #0f0f12; }
    }
    body.panic-alert {
      animation: terrorFlash 0.4s ease-in-out infinite;
    }

    .app-card {
      width: 100%;
      max-width: 820px;
      background: #1a1a1e;
      border: 1px solid #2e2e36;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      height: 94vh;
      overflow: hidden;
      position: relative;
    }

    header {
      padding: 14px 20px;
      background-color: #121215;
      border-bottom: 1px solid #2e2e36;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      font-size: 1.15rem;
      color: #ff4757;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 999px;
      background: #2e2e36;
      color: #a8a8b3;
    }
    .badge-host {
      background: #e67e22;
      color: #fff;
      font-weight: bold;
    }
    .badge-bot {
      background: #3742fa;
      color: #fff;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
    }

    #view-lobby {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    label {
      font-size: 0.85rem;
      color: #a8a8b3;
      font-weight: 600;
    }
    input, select {
      background: #121215;
      border: 1px solid #2e2e36;
      color: #fff;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #ff4757;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .box-panel {
      background: #24242b;
      padding: 16px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid #2e2e36;
    }
    .row {
      display: flex;
      gap: 10px;
    }
    .row > * {
      flex: 1;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      color: #e1e1e6;
    }
    .checkbox-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    button {
      cursor: pointer;
      border-radius: 6px;
      font-weight: 600;
      border: none;
      transition: opacity 0.2s, background 0.2s;
    }
    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .btn-danger {
      background: #ff4757;
      color: white;
      padding: 10px 16px;
    }
    .btn-danger:hover:not(:disabled) {
      background: #e84118;
    }
    .btn-primary {
      background: #2ed573;
      color: #0c1b11;
      padding: 10px 16px;
    }
    .btn-primary:hover:not(:disabled) {
      background: #26af5f;
    }
    .btn-secondary {
      background: #2e2e36;
      color: #fff;
      padding: 8px 14px;
    }
    .btn-secondary:hover:not(:disabled) {
      background: #3e3e48;
    }
    .btn-bot {
      background: #3742fa;
      color: #fff;
      padding: 6px 12px;
      font-size: 0.85rem;
    }
    .btn-bot:hover:not(:disabled) {
      background: #2f3542;
    }

    .room-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .room-item {
      background: #24242b;
      padding: 12px 16px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #2e2e36;
    }

    #view-room {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }
    .room-topbar {
      padding: 10px 16px;
      background: #141418;
      border-bottom: 1px solid #2e2e36;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .players-list {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .player-pill {
      background: #24242b;
      border: 1px solid #2e2e36;
      padding: 4px 10px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
    }
    .player-pill.active-turn {
      border-color: #ff4757;
      background: #3a151b;
      color: #ff6b81;
      font-weight: bold;
    }
    .penalty-indicator {
      color: #ff4757;
      font-weight: bold;
    }

    #waiting-control-panel {
      padding: 12px 16px;
      background: #1e1e24;
      border-bottom: 1px solid #2e2e36;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .host-settings-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      background: #141418;
      padding: 8px 12px;
      border-radius: 6px;
      flex-wrap: wrap;
    }
    .host-settings-bar input[type="number"] {
      width: 70px;
      padding: 6px 8px;
    }
    .bot-control-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      background: #181820;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px dashed #3742fa;
      flex-wrap: wrap;
    }
    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #story-scroll {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #121215;
    }
    .novel-card {
      background: #1e1e24;
      border-left: 3px solid #ff4757;
      padding: 10px 14px;
      border-radius: 4px;
      border-top: 1px solid #2e2e36;
      border-right: 1px solid #2e2e36;
      border-bottom: 1px solid #2e2e36;
    }
    .novel-card.sys-card {
      border-left-color: #e67e22;
      background: #2d1d13;
      color: #f39c12;
      font-size: 0.85rem;
    }
    .novel-card.ai-first {
      border-left-color: #3742fa;
      background: #151833;
    }
    .card-header {
      font-size: 0.75rem;
      color: #8d8d99;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    .duration-stamp {
      color: #2ed573;
      font-weight: 500;
    }
    .card-content {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #f1f2f6;
      word-break: break-word;
    }

    #bottom-dock {
      padding: 12px 16px;
      background: #141418;
      border-top: 1px solid #2e2e36;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .live-status-bar {
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 50;
    }
    .modal-content {
      background: #1a1a1e;
      border: 1px solid #2e2e36;
      border-radius: 8px;
      padding: 20px;
      width: 100%;
      max-width: 580px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    #final-novel-body {
      background: #121215;
      padding: 14px;
      border-radius: 6px;
      overflow-y: auto;
      max-height: 50vh;
      font-size: 0.95rem;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    #panic-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(180, 0, 0, 0.45);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 45;
      pointer-events: none;
    }
    #panic-overlay .emoji {
      font-size: 4.5rem;
      filter: drop-shadow(0 0 15px #ff0000);
      animation: pulse 0.3s infinite alternate;
    }
    #panic-overlay h2 {
      font-size: 1.5rem;
      color: #fff;
      margin-top: 10px;
      text-shadow: 0 0 8px #ff0000;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.15); }
    }
  </style>
</head>
<body>

  <div id="panic-overlay">
    <div class="emoji">😱</div>
    <h2>시간 초과! 경고 1회 적립!</h2>
  </div>

  <div class="app-card">
    <header>
      <h1>릴레이소설공포증 😱</h1>
      <span id="label-user" class="badge">설정 필요</span>
    </header>

    <!-- [1. 로비 화면] -->
    <div id="view-lobby">
      <div class="form-group">
        <label>작가 닉네임</label>
        <input type="text" id="input-nickname" placeholder="닉네임 입력" maxlength="10">
      </div>

      <div class="box-panel">
        <label>방 만들기</label>
        <input type="text" id="create-room-title" placeholder="방 제목 입력">
        <div class="row">
          <div>
            <label>모드</label>
            <select id="create-room-mode">
              <option value="infinite">무한 모드</option>
              <option value="timed">시간제한 모드</option>
            </select>
          </div>
          <div id="create-turn-limit-box" style="display: none;">
            <label>턴 제한시간 (초)</label>
            <input type="number" id="create-turn-seconds" value="30" min="5" max="300">
          </div>
          <div id="create-total-limit-box" style="display: none;">
            <label>전체 제한시간 (분)</label>
            <input type="number" id="create-total-minutes" value="5" min="1" max="120">
          </div>
        </div>

        <label class="checkbox-label" style="margin-top: 4px;">
          <input type="checkbox" id="create-ai-first" checked>
          <span>AI 첫 문장 실시간 생성</span>
        </label>

        <button id="btn-create-room" class="btn-danger">방 개설</button>
      </div>

      <div class="form-group" style="flex:1;">
        <label>방 목록</label>
        <div id="room-list" class="room-list">
          <p style="color: #666; font-size: 0.85rem;">개설된 방이 없습니다.</p>
        </div>
      </div>
    </div>

    <!-- [2. 방 화면] -->
    <div id="view-room">
      <div class="room-topbar">
        <div>
          <strong id="room-title-label">방 제목</strong>
          <span id="room-mode-tag" class="badge">모드</span>
        </div>
        <div class="players-list" id="room-players-list"></div>
      </div>

      <!-- 대기실 영역 -->
      <div id="waiting-control-panel">
        <div id="host-settings-area" class="host-settings-bar" style="display: none;">
          <span class="badge badge-host">방장</span>
          <select id="live-mode-select">
            <option value="infinite">무한 모드</option>
            <option value="timed">시간제한 모드</option>
          </select>
          <div id="live-timed-options" style="display: flex; gap: 6px; align-items: center;">
            <input type="number" id="live-turn-input" min="5" max="300" title="턴 제한시간(초)">
            <span style="font-size:0.8rem; color:#888;">초</span>
            <input type="number" id="live-total-input" min="1" max="120" title="전체 제한시간(분)">
            <span style="font-size:0.8rem; color:#888;">분</span>
          </div>
          <label class="checkbox-label" style="font-size: 0.8rem; margin-left: 6px;">
            <input type="checkbox" id="live-ai-first-toggle">
            <span>AI 첫 문장</span>
          </label>
        </div>

        <!-- 봇 추가 바 (방장 전용) -->
        <div id="host-bot-bar" class="bot-control-bar" style="display: none;">
          <span class="badge badge-bot">AI 봇 초대</span>
          <select id="select-bot-persona" style="padding: 6px 10px; font-size: 0.85rem;">
            <option value="choding">초딩작가 (유치찬란/예측불허)</option>
            <option value="shakespeare">셰익스피어 (고전비극/문학성)</option>
            <option value="spicy_webnovel">성인웹소설작가 (치명적 매운맛)</option>
            <option value="hardboiled">하드보일드 탐정 (냉소적 느와르)</option>
            <option value="k_fantasy">K-판타지 작가 (상태창/각성)</option>
            <option value="cyberpunk">사이버펑크 해커 (디스토피아/IT)</option>
            <option value="occult">오컬트 괴담 수집가 (서늘한 공포)</option>
            <option value="makjang">막장 아침드라마 (출생의 비밀/분노)</option>
          </select>
          <button id="btn-add-bot" class="btn-bot">+ 봇 추가</button>
        </div>

        <div class="action-bar">
          <span id="waiting-info-text" style="font-size: 0.85rem; color: #a8a8b3;"></span>
          <div style="display: flex; gap: 8px;">
            <button id="btn-ready-toggle" class="btn-primary">레디</button>
            <button id="btn-host-start" class="btn-danger" style="display: none;" disabled>시작</button>
            <button id="btn-exit-room" class="btn-secondary">나가기</button>
          </div>
        </div>
      </div>

      <!-- 본문 목록 -->
      <div id="story-scroll"></div>

      <!-- 하단 입력 독 -->
      <div id="bottom-dock">
        <div class="live-status-bar">
          <span id="turn-message">대기 중</span>
          <span id="time-left-tag" style="color: #ff6b81; font-weight: bold;"></span>
          <button id="btn-vote-finish" class="btn-secondary" style="font-size: 0.75rem;">소설 완결 (0/0)</button>
        </div>
        <form id="novel-input-form" class="row">
          <input type="text" id="novel-text-input" placeholder="문장을 입력하세요..." autocomplete="off" disabled>
          <button type="submit" id="btn-submit-sentence" class="btn-danger" style="flex: 0 0 90px;" disabled>등록</button>
        </form>
      </div>
    </div>

    <!-- 완결 모달 -->
    <div id="modal-novel-end" class="modal-overlay">
      <div class="modal-content">
        <h2 style="color: #2ed573; font-size: 1.15rem;">소설 완성</h2>
        <div id="final-novel-body"></div>
        <div style="display: flex; gap: 8px; justify-content: flex-end;">
          <button id="btn-save-pdf" class="btn-primary">PDF 다운로드</button>
          <button id="btn-modal-exit" class="btn-secondary">나가기</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { 
      getDatabase, ref, set, push, onValue, update, remove, onDisconnect 
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBsvhq6Y1KzvUJ9gUlF6_QEgYoj-FzuZMU",
      authDomain: "relaynovelphobia.firebaseapp.com",
      databaseURL: "https://relaynovelphobia-default-rtdb.firebaseio.com",
      projectId: "relaynovelphobia",
      storageBucket: "relaynovelphobia.firebasestorage.app",
      messagingSenderId: "365170091282",
      appId: "1:365170091282:web:6956889d54eea4070bbfcb",
      measurementId: "G-Q9LHNRX3T0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 8종 봇의 프롬프트 페르소나 정의 (고정 텍스트 풀 없음, 순수 LLM 작문 지침)
    const BOT_PERSONAS = {
      choding: {
        name: "초딩작가",
        instruction: "너는 초등학생 작가다. 유치찬란하고 맞춤법이 일부 파괴된 말투, 엉뚱한 반전, 'ㅋㅋ'나 'ㄷㄷ' 같은 유행어를 섞어라."
      },
      shakespeare: {
        name: "셰익스피어",
        instruction: "너는 셰익스피어 풍의 고전문학 작가다. 비극적이고 웅장하며 운명과 죽음, 철학적 은유를 담은 고풍스러운 한국어 독백 문체로 써라."
      },
      spicy_webnovel: {
        name: "성인웹소설작가",
        instruction: "너는 치명적이고 매운맛의 성인 로맨스/웹소설 작가다. 팽팽한 긴장감, 턱을 쥐어 올리는 스킨십, 숨결, 아찔하고 도발적인 어조로 써라."
      },
      hardboiled: {
        name: "하드보일드 탐정",
        instruction: "너는 비정한 하드보일드 탐정이다. 위스키, 빗줄기, 담배 연기, 시체, 냉소적이고 무덤덤한 느와르 독백으로 써라."
      },
      k_fantasy: {
        name: "K-판타지 작가",
        instruction: "너는 K-판타지 웹소설 작가다. [상태창 알림], 헌터 각성, 마나 회로, 회귀자 클리셰를 담아 박진감 넘치게 써라."
      },
      cyberpunk: {
        name: "사이버펑크 해커",
        instruction: "너는 디스토피아 사이버펑크 해커다. 네온사인, 뉴런 링크, 암호화 패킷, 기계 의수, 크레딧 등 IT 은어를 섞어 써라."
      },
      occult: {
        name: "오컬트 괴담 수집가",
        instruction: "너는 기괴한 공포 괴담 수집가다. 기괴한 소리, 뒤틀린 관절, 불길한 금기와 서늘한 소름을 유발하도록 써라."
      },
      makjang: {
        name: "막장 아침드라마",
        instruction: "너는 막장 아침드라마 작가다. 출생의 비밀, 유전자 검사, 배신, 물세례, 격정적인 고함과 대사로 충격적인 반전을 만들어라."
      }
    };

    let myId = localStorage.getItem("rnp_uid");
    if (!myId) {
      myId = "user_" + Math.random().toString(36).substring(2, 9);
      localStorage.setItem("rnp_uid", myId);
    }
    let myNick = localStorage.getItem("rnp_nick") || "";
    let currentRoomId = null;
    let roomData = null;
    let turnTimer = null;
    let panicTimeout = null;
    let botExecutionTimeout = null;

    const labelUser = document.getElementById("label-user");
    const inputNickname = document.getElementById("input-nickname");
    const viewLobby = document.getElementById("view-lobby");
    const viewRoom = document.getElementById("view-room");
    const createRoomTitle = document.getElementById("create-room-title");
    const createRoomMode = document.getElementById("create-room-mode");
    const createTurnSeconds = document.getElementById("create-turn-seconds");
    const createTotalMinutes = document.getElementById("create-total-minutes");
    const createAiFirst = document.getElementById("create-ai-first");
    const createTurnLimitBox = document.getElementById("create-turn-limit-box");
    const createTotalLimitBox = document.getElementById("create-total-limit-box");
    const btnCreateRoom = document.getElementById("btn-create-room");
    const roomList = document.getElementById("room-list");

    const roomTitleLabel = document.getElementById("room-title-label");
    const roomModeTag = document.getElementById("room-mode-tag");
    const roomPlayersList = document.getElementById("room-players-list");
    const waitingControlPanel = document.getElementById("waiting-control-panel");
    const hostSettingsArea = document.getElementById("host-settings-area");
    const liveModeSelect = document.getElementById("live-mode-select");
    const liveTimedOptions = document.getElementById("live-timed-options");
    const liveTurnInput = document.getElementById("live-turn-input");
    const liveTotalInput = document.getElementById("live-total-input");
    const liveAiFirstToggle = document.getElementById("live-ai-first-toggle");
    const hostBotBar = document.getElementById("host-bot-bar");
    const selectBotPersona = document.getElementById("select-bot-persona");
    const btnAddBot = document.getElementById("btn-add-bot");
    const waitingInfoText = document.getElementById("waiting-info-text");
    const btnReadyToggle = document.getElementById("btn-ready-toggle");
    const btnHostStart = document.getElementById("btn-host-start");
    const btnExitRoom = document.getElementById("btn-exit-room");
    const storyScroll = document.getElementById("story-scroll");
    const turnMessage = document.getElementById("turn-message");
    const timeLeftTag = document.getElementById("time-left-tag");
    const btnVoteFinish = document.getElementById("btn-vote-finish");
    const novelInputForm = document.getElementById("novel-input-form");
    const novelTextInput = document.getElementById("novel-text-input");
    const btnSubmitSentence = document.getElementById("btn-submit-sentence");
    const modalNovelEnd = document.getElementById("modal-novel-end");
    const finalNovelBody = document.getElementById("final-novel-body");
    const btnSavePdf = document.getElementById("btn-save-pdf");
    const btnModalExit = document.getElementById("btn-modal-exit");
    const panicOverlay = document.getElementById("panic-overlay");

    if (myNick) {
      inputNickname.value = myNick;
      labelUser.textContent = myNick;
    }
    inputNickname.addEventListener("change", (e) => {
      myNick = e.target.value.trim() || "작가";
      localStorage.setItem("rnp_nick", myNick);
      labelUser.textContent = myNick;
      if (currentRoomId) {
        update(ref(db, `rooms/${currentRoomId}/players/${myId}`), { name: myNick });
      }
    });

    createRoomMode.addEventListener("change", () => {
      const isTimed = createRoomMode.value === "timed";
      createTurnLimitBox.style.display = isTimed ? "block" : "none";
      createTotalLimitBox.style.display = isTimed ? "block" : "none";
    });

    // 1. 방 목록 감시 (사람이 0명이면 방 자동 폭파)
    onValue(ref(db, "rooms"), (snapshot) => {
      const rooms = snapshot.val();
      roomList.innerHTML = "";
      if (!rooms) {
        roomList.innerHTML = `<p style="color: #666; font-size: 0.85rem;">개설된 방이 없습니다.</p>`;
        return;
      }
      Object.keys(rooms).forEach((rId) => {
        const r = rooms[rId];
        const pList = r.players ? Object.values(r.players) : [];
        const humanCount = pList.filter(p => !p.isBot).length;
        
        // 사람이 없으면 방 즉시 삭제
        if (humanCount === 0) {
          remove(ref(db, `rooms/${rId}`));
          return;
        }

        const div = document.createElement("div");
        div.className = "room-item";
        div.innerHTML = `
          <div>
            <strong>${escapeHtml(r.title)}</strong>
            <div style="font-size: 0.8rem; color: #a8a8b3; margin-top: 4px;">
              ${r.mode === "timed" ? `시간제한 (${r.turnLimit}초 / ${r.totalLimit}분)` : "무한"} · 인원: ${pList.length}명 (인간 ${humanCount}명) · ${r.status === "playing" ? "진행중" : "대기"}
            </div>
          </div>
          <button class="btn-danger" style="padding: 6px 14px; font-size: 0.85rem;">입장</button>
        `;
        div.querySelector("button").addEventListener("click", () => joinRoom(rId));
        roomList.appendChild(div);
      });
    });

    // 2. 방 개설
    btnCreateRoom.addEventListener("click", () => {
      const title = createRoomTitle.value.trim() || "릴레이 소설";
      const mode = createRoomMode.value;
      const turnLimit = Math.max(5, parseInt(createTurnSeconds.value, 10) || 30);
      const totalLimit = Math.max(1, parseInt(createTotalMinutes.value, 10) || 5);
      const useAiFirst = createAiFirst.checked;
      myNick = inputNickname.value.trim() || "작가_" + myId.slice(-3);
      localStorage.setItem("rnp_nick", myNick);

      const newRef = push(ref(db, "rooms"));
      const rId = newRef.key;

      const newRoom = {
        title: title,
        mode: mode,
        turnLimit: turnLimit,
        totalLimit: totalLimit,
        useAiFirst: useAiFirst,
        status: "waiting",
        currentTurnIndex: 0,
        playerOrder: [myId],
        turnStartTime: 0,
        gameStartTime: 0,
        finishVotes: {},
        players: {
          [myId]: {
            name: myNick,
            isReady: false,
            penalties: 0,
            isBot: false,
            joinedAt: Date.now()
          }
        },
        stories: {}
      };

      set(newRef, newRoom).then(() => {
        joinRoom(rId);
      });
    });

    // 3. 방 입장
    function joinRoom(rId) {
      currentRoomId = rId;
      myNick = inputNickname.value.trim() || "작가_" + myId.slice(-3);
      localStorage.setItem("rnp_nick", myNick);

      const playerRef = ref(db, `rooms/${rId}/players/${myId}`);
      update(playerRef, {
        name: myNick,
        isReady: false,
        penalties: 0,
        isBot: false,
        joinedAt: Date.now()
      });

      // 브라우저 닫힘 시 자동 제거
      onDisconnect(playerRef).remove();

      viewLobby.style.display = "none";
      viewRoom.style.display = "flex";

      listenToRoom(rId);
    }

    // 4. 방 데이터 실시간 수신 및 방장 승계
    function listenToRoom(rId) {
      const roomRef = ref(db, `rooms/${rId}`);
      onValue(roomRef, (snapshot) => {
        roomData = snapshot.val();
        
        if (!roomData) {
          cleanUpAndExit();
          return;
        }

        const players = roomData.players || {};
        const pIds = Object.keys(players);

        // 사람이 0명이면 방 즉시 삭제
        const humanIds = pIds.filter(id => !players[id].isBot);
        if (humanIds.length === 0) {
          remove(roomRef);
          cleanUpAndExit();
          return;
        }

        // 인간 참가자 중 가장 먼저 들어온 사람이 방장
        let determinedHostId = humanIds[0];
        let oldestTime = players[determinedHostId].joinedAt || 0;
        humanIds.forEach(id => {
          if (players[id].joinedAt && players[id].joinedAt < oldestTime) {
            oldestTime = players[id].joinedAt;
            determinedHostId = id;
          }
        });

        if (roomData.hostId !== determinedHostId && determinedHostId === myId) {
          update(roomRef, { hostId: determinedHostId });
        }

        renderRoomState(determinedHostId, pIds);
      });
    }

    // 5. 방 화면 렌더링
    function renderRoomState(hostId, pIds) {
      const isHost = (myId === hostId);
      const players = roomData.players || {};

      roomTitleLabel.textContent = roomData.title;
      roomModeTag.textContent = roomData.mode === "timed" 
        ? `${roomData.turnLimit}초 / ${roomData.totalLimit}분` 
        : "무한 모드";

      roomPlayersList.innerHTML = "";
      const currentTurnId = (roomData.playerOrder && roomData.playerOrder.length > 0)
        ? roomData.playerOrder[roomData.currentTurnIndex % roomData.playerOrder.length]
        : null;

      pIds.forEach(pId => {
        const p = players[pId];
        const chip = document.createElement("div");
        chip.className = "player-pill";
        if (roomData.status === "playing" && pId === currentTurnId) {
          chip.classList.add("active-turn");
        }
        
        let subBadge = "";
        if (pId === hostId) {
          subBadge = '<span class="badge badge-host" style="font-size:0.65rem;">방장</span>';
        } else if (p.isBot) {
          subBadge = '<span class="badge badge-bot">BOT</span>';
        } else if (roomData.status === "waiting") {
          subBadge = `<span style="color:${p.isReady ? '#2ed573' : '#666'}; font-size:0.75rem;">${p.isReady ? '레디' : '대기'}</span>`;
        }

        chip.innerHTML = `
          ${subBadge}
          <span>${escapeHtml(p.name)}</span>
          ${p.penalties > 0 ? `<span class="penalty-indicator">⚠️${p.penalties}</span>` : ''}
          ${isHost && p.isBot && roomData.status === "waiting" ? `<span style="cursor:pointer; color:#ff4757; font-weight:bold; margin-left:4px;" title="추방">×</span>` : ''}
        `;

        if (isHost && p.isBot && roomData.status === "waiting") {
          chip.querySelector("span[title='추방']").addEventListener("click", () => {
            remove(ref(db, `rooms/${currentRoomId}/players/${pId}`));
          });
        }

        roomPlayersList.appendChild(chip);
      });

      if (roomData.status === "waiting") {
        waitingControlPanel.style.display = "flex";
        storyScroll.style.display = "none";
        novelInputForm.style.display = "none";
        clearInterval(turnTimer);
        clearTimeout(botExecutionTimeout);
        timeLeftTag.textContent = "";

        if (isHost) {
          hostSettingsArea.style.display = "flex";
          hostBotBar.style.display = "flex";
          liveModeSelect.value = roomData.mode;
          liveTimedOptions.style.display = roomData.mode === "timed" ? "flex" : "none";
          liveAiFirstToggle.checked = roomData.useAiFirst ?? true;
          
          if (document.activeElement !== liveTurnInput) liveTurnInput.value = roomData.turnLimit;
          if (document.activeElement !== liveTotalInput) liveTotalInput.value = roomData.totalLimit;

          btnHostStart.style.display = "inline-block";
          btnReadyToggle.style.display = "none";

          const nonHostHumanIds = pIds.filter(id => id !== hostId && !players[id].isBot);
          const allReady = nonHostHumanIds.length === 0 || nonHostHumanIds.every(id => players[id].isReady);
          
          btnHostStart.disabled = !allReady;
          waitingInfoText.textContent = allReady ? "시작 가능" : "참가자 레디 대기 중";
        } else {
          hostSettingsArea.style.display = "none";
          hostBotBar.style.display = "none";
          btnHostStart.style.display = "none";
          btnReadyToggle.style.display = "inline-block";

          const myReady = players[myId]?.isReady || false;
          btnReadyToggle.textContent = myReady ? "준비 완료" : "레디";
          btnReadyToggle.style.background = myReady ? "#ff4757" : "#2ed573";
          waitingInfoText.textContent = myReady ? "방장 시작 대기 중" : "준비 후 레디를 눌러주세요";
        }
      } else if (roomData.status === "playing") {
        waitingControlPanel.style.display = "none";
        storyScroll.style.display = "flex";
        novelInputForm.style.display = "flex";
        renderStoryFeed();
        runTurnTimerLoop(currentTurnId, hostId);

        // 현재 턴이 봇인 경우 방장 브라우저에서 실시간 LLM 작문 실행
        if (players[currentTurnId]?.isBot && isHost) {
          scheduleLiveLlmBotTurn(currentTurnId);
        }
      } else if (roomData.status === "finished") {
        openFinishDialog();
      }

      const votes = roomData.finishVotes || {};
      const humanIds = pIds.filter(id => !players[id].isBot);
      const agreeCount = humanIds.filter(id => votes[id] === true).length;
      btnVoteFinish.textContent = `소설 완결 (${agreeCount}/${humanIds.length})`;
      btnVoteFinish.style.background = votes[myId] ? "#2ed573" : "#2e2e36";
    }

    liveModeSelect.addEventListener("change", () => {
      update(ref(db, `rooms/${currentRoomId}`), { mode: liveModeSelect.value });
    });
    liveTurnInput.addEventListener("change", () => {
      const val = Math.max(5, parseInt(liveTurnInput.value, 10) || 30);
      update(ref(db, `rooms/${currentRoomId}`), { turnLimit: val });
    });
    liveTotalInput.addEventListener("change", () => {
      const val = Math.max(1, parseInt(liveTotalInput.value, 10) || 5);
      update(ref(db, `rooms/${currentRoomId}`), { totalLimit: val });
    });
    liveAiFirstToggle.addEventListener("change", () => {
      update(ref(db, `rooms/${currentRoomId}`), { useAiFirst: liveAiFirstToggle.checked });
    });

    // 봇 추가
    btnAddBot.addEventListener("click", () => {
      if (!currentRoomId) return;
      const personaKey = selectBotPersona.value;
      const preset = BOT_PERSONAS[personaKey];
      const botId = "bot_" + personaKey + "_" + Math.random().toString(36).substring(2, 7);

      const botPlayer = {
        name: `${preset.name}🤖`,
        persona: personaKey,
        isBot: true,
        isReady: true,
        penalties: 0,
        joinedAt: Date.now()
      };

      set(ref(db, `rooms/${currentRoomId}/players/${botId}`), botPlayer);
    });

    btnReadyToggle.addEventListener("click", () => {
      if (!roomData) return;
      const cur = roomData.players[myId]?.isReady || false;
      update(ref(db, `rooms/${currentRoomId}/players/${myId}`), { isReady: !cur });
    });

    // 6. 시작 버튼 클릭 (AI 첫 문장도 LLM 실시간 생성)
    btnHostStart.addEventListener("click", async () => {
      const pIds = Object.keys(roomData.players || {});
      const now = Date.now();
      const updates = {};

      updates[`rooms/${currentRoomId}/status`] = "playing";
      updates[`rooms/${currentRoomId}/playerOrder`] = pIds;
      updates[`rooms/${currentRoomId}/currentTurnIndex`] = 0;
      updates[`rooms/${currentRoomId}/turnStartTime`] = now;
      updates[`rooms/${currentRoomId}/gameStartTime`] = now;

      if (roomData.useAiFirst) {
        // 첫 문장도 고정 텍스트가 아닌 실시간 LLM 작문으로 생성
        let firstSentence = "";
        try {
          const roomTitle = roomData.title || "미스터리";
          const firstPrompt = `방 제목이 '${roomTitle}'인 릴레이 소설의 도입부 첫 문장을 흥미진진하고 기괴하게 딱 1문장만 한국어로 창작해라. 따옴표나 사족 없이 본문 1문장만 출력해라.`;
          const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(firstPrompt)}?seed=${Math.floor(Math.random()*100000)}`);
          if (res.ok) {
            const reply = await res.text();
            firstSentence = cleanLlmText(reply);
          }
        } catch (e) {
          console.warn("첫 문장 실시간 생성 지연:", e);
        }

        if (!firstSentence) {
          firstSentence = "자정이 지난 시각, 굳게 닫힌 문 너머에서 분명히 내 이름을 부르는 소리가 들려왔다.";
        }

        const firstStoryRef = push(ref(db, `rooms/${currentRoomId}/stories`));
        updates[`rooms/${currentRoomId}/stories/${firstStoryRef.key}`] = {
          author: "AI 프롬프트",
          text: firstSentence,
          isSystem: false,
          isAiFirst: true,
          durationStr: "실시간 생성",
          timestamp: now
        };
      }

      update(ref(db), updates);
    });

    // 7. 실시간 LLM 작문 엔진 (전체 소설 맥락 통주입)
    function scheduleLiveLlmBotTurn(botId) {
      clearTimeout(botExecutionTimeout);
      const bot = roomData.players[botId];
      if (!bot) return;

      botExecutionTimeout = setTimeout(async () => {
        if (roomData.status !== "playing") return;
        const curTurnId = roomData.playerOrder[roomData.currentTurnIndex % roomData.playerOrder.length];
        if (curTurnId !== botId) return;

        const preset = BOT_PERSONAS[bot.persona] || BOT_PERSONAS.choding;
        
        // 지금까지 작성된 전체 소설 본문을 순서대로 결합 (문맥 통주입)
        const stories = roomData.stories || {};
        const allStoryTexts = Object.values(stories)
          .filter(s => !s.isSystem)
          .map(s => s.text)
          .join(" ");

        let generatedSentence = "";

        try {
          // 무료 무제한 LLM 엔드포인트 호출 (전체 소설 맥락 전달)
          const systemInstruction = preset.instruction;
          const userPrompt = `[전체 소설 줄거리]: "${allStoryTexts || '소설이 막 시작되었다.'}"\n\n[지시사항]: 너는 '${preset.name}'이다. 지침: (${systemInstruction}). 지금까지 작성된 전체 소설 줄거리의 사건과 인물 맥락을 철저히 반영하여, 바로 뒤에 자연스럽게 이어질 다음 사건이나 인물의 행동을 '딱 한 문장'만 한국어로 창작해라. 따옴표나 사족 없이 본문 문장만 즉시 출력해라.`;

          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 8500); // 8.5초 타임아웃
          
          const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(userPrompt)}?seed=${Math.floor(Math.random()*100000)}`, {
            signal: controller.signal
          });
          clearTimeout(timeoutId);

          if (res.ok) {
            const rawText = await res.text();
            generatedSentence = cleanLlmText(rawText);
          }
        } catch (e) {
          console.warn("AI 실시간 생성 오류:", e);
        }

        // 네트워크 순단 시 최소한의 연결 문장
        if (!generatedSentence || generatedSentence.length < 5) {
          generatedSentence = `그 순간 예상치 못한 정적이 감돌며 상황은 전혀 다른 방향으로 흐르기 시작했다.`;
        }

        // DB에 AI가 실시간 창작한 문장 기록 및 다음 차례로 이동
        if (roomData.status !== "playing") return;
        const now = Date.now();
        const turnStart = roomData.turnStartTime || now;
        const durationSec = Math.max(1, Math.floor((now - turnStart) / 1000));

        const nextIndex = (roomData.currentTurnIndex + 1) % roomData.playerOrder.length;
        const updates = {};

        const storyRef = push(ref(db, `rooms/${currentRoomId}/stories`));
        updates[`rooms/${currentRoomId}/stories/${storyRef.key}`] = {
          author: bot.name,
          text: generatedSentence,
          isSystem: false,
          isBot: true,
          durationStr: `${durationSec}초`,
          timestamp: now
        };

        updates[`rooms/${currentRoomId}/currentTurnIndex`] = nextIndex;
        updates[`rooms/${currentRoomId}/turnStartTime`] = now;

        update(ref(db), updates);
      }, 1800);
    }

    // LLM 출력 정제 헬퍼 함수
    function cleanLlmText(text) {
      if (!text) return "";
      let cleaned = text.replace(/^(문장:|답변:|소설:|이어지는 문장:)/gi, "").trim();
      cleaned = cleaned.replace(/^["'“”‘]+|["'“”‘]+$/g, "").trim();
      // 여러 줄 출력 시 첫 줄만 사용
      cleaned = cleaned.split("\n")[0].trim();
      return cleaned;
    }

    // 8. 턴 타이머 루프
    function runTurnTimerLoop(currentTurnId, hostId) {
      const isMyTurn = (currentTurnId === myId);
      const currentWriter = roomData.players[currentTurnId];
      const isCurrentBot = currentWriter?.isBot;

      novelTextInput.disabled = !isMyTurn;
      btnSubmitSentence.disabled = !isMyTurn;

      const writerName = currentWriter?.name || "익명";
      if (isMyTurn) {
        turnMessage.innerHTML = `<span style="color:#2ed573; font-weight:bold;">내 차례</span>`;
      } else {
        turnMessage.textContent = `${writerName} 작성 중${isCurrentBot ? ' (전체 맥락 실시간 작문)' : ''}`;
      }

      clearInterval(turnTimer);

      const mode = roomData.mode;
      const turnLimit = roomData.turnLimit;
      const totalLimitSec = (roomData.totalLimit || 5) * 60;
      const turnStart = roomData.turnStartTime || Date.now();
      const gameStart = roomData.gameStartTime || Date.now();

      turnTimer = setInterval(() => {
        const now = Date.now();

        if (mode === "timed") {
          const totalElapsed = Math.floor((now - gameStart) / 1000);
          const totalRemaining = totalLimitSec - totalElapsed;

          if (totalRemaining <= 0) {
            clearInterval(turnTimer);
            if (myId === hostId) {
              triggerForceFinishByTime();
            }
            return;
          }

          const elapsed = Math.floor((now - turnStart) / 1000);
          const remaining = turnLimit - elapsed;

          const totalMin = Math.floor(totalRemaining / 60);
          const totalSec = totalRemaining % 60;

          if (remaining > 0) {
            timeLeftTag.textContent = `턴: ${remaining}초 | 전체: ${totalMin}분 ${totalSec}초`;
          } else {
            timeLeftTag.textContent = `턴 종료`;
            clearInterval(turnTimer);
            if (isMyTurn) {
              handlePanicTimeout();
            }
          }
        } else {
          const currentElapsed = Math.floor((now - turnStart) / 1000);
          const m = Math.floor(currentElapsed / 60);
          const s = currentElapsed % 60;
          timeLeftTag.textContent = `소요 시간: ${m > 0 ? m + '분 ' : ''}${s}초`;
        }
      }, 1000);
    }

    function handlePanicTimeout() {
      triggerPanicUI();

      const curPenalties = (roomData.players[myId]?.penalties || 0) + 1;
      const nextIndex = (roomData.currentTurnIndex + 1) % roomData.playerOrder.length;
      const updates = {};

      updates[`rooms/${currentRoomId}/players/${myId}/penalties`] = curPenalties;
      updates[`rooms/${currentRoomId}/currentTurnIndex`] = nextIndex;
      updates[`rooms/${currentRoomId}/turnStartTime`] = Date.now();

      const storyRef = push(ref(db, `rooms/${currentRoomId}/stories`));
      updates[`rooms/${currentRoomId}/stories/${storyRef.key}`] = {
        author: "SYSTEM",
        text: `😱 [${myNick}] 시간 초과! 경고 1회 적립 (누적 ${curPenalties}회)`,
        isSystem: true,
        timestamp: Date.now()
      };

      update(ref(db), updates);
    }

    function triggerForceFinishByTime() {
      const updates = {};
      updates[`rooms/${currentRoomId}/status`] = "finished";
      const storyRef = push(ref(db, `rooms/${currentRoomId}/stories`));
      updates[`rooms/${currentRoomId}/stories/${storyRef.key}`] = {
        author: "SYSTEM",
        text: `⌛ 제한 시간 종료로 소설이 완결되었습니다.`,
        isSystem: true,
        timestamp: Date.now()
      };
      update(ref(db), updates);
    }

    function triggerPanicUI() {
      document.body.classList.add("panic-alert");
      panicOverlay.style.display = "flex";

      if (panicTimeout) clearTimeout(panicTimeout);
      panicTimeout = setTimeout(() => {
        document.body.classList.remove("panic-alert");
        panicOverlay.style.display = "none";
      }, 3000);
    }

    // 사람 참가자 문장 입력
    novelInputForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = novelTextInput.value.trim();
      if (!text || roomData.status !== "playing") return;

      const currentTurnId = roomData.playerOrder[roomData.currentTurnIndex % roomData.playerOrder.length];
      if (currentTurnId !== myId) return;

      const now = Date.now();
      const turnStart = roomData.turnStartTime || now;
      const durationSec = Math.max(1, Math.floor((now - turnStart) / 1000));
      const durationFormatted = durationSec >= 60 
        ? `${Math.floor(durationSec / 60)}분 ${durationSec % 60}초` 
        : `${durationSec}초`;

      const nextIndex = (roomData.currentTurnIndex + 1) % roomData.playerOrder.length;
      const updates = {};

      const storyRef = push(ref(db, `rooms/${currentRoomId}/stories`));
      updates[`rooms/${currentRoomId}/stories/${storyRef.key}`] = {
        author: myNick,
        text: text,
        isSystem: false,
        durationStr: durationFormatted,
        timestamp: now
      };

      updates[`rooms/${currentRoomId}/currentTurnIndex`] = nextIndex;
      updates[`rooms/${currentRoomId}/turnStartTime`] = now;

      update(ref(db), updates).then(() => {
        novelTextInput.value = "";
      });
    });

    function renderStoryFeed() {
      storyScroll.innerHTML = "";
      const stories = roomData.stories || {};

      Object.values(stories).forEach(s => {
        const card = document.createElement("div");
        card.className = "novel-card";
        if (s.isSystem) card.classList.add("sys-card");
        if (s.isAiFirst) card.classList.add("ai-first");

        const timeStr = s.timestamp ? new Date(s.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "";
        const durationTag = s.durationStr ? `<span class="duration-stamp">(${s.durationStr})</span>` : "";

        card.innerHTML = `
          <div class="card-header">
            <strong>${escapeHtml(s.author)} ${durationTag}</strong>
            <span>${timeStr}</span>
          </div>
          <div class="card-content">${escapeHtml(s.text)}</div>
        `;
        storyScroll.appendChild(card);
      });
      storyScroll.scrollTop = storyScroll.scrollHeight;
    }

    btnVoteFinish.addEventListener("click", () => {
      if (!roomData || roomData.status !== "playing") return;
      const curVote = roomData.finishVotes?.[myId] || false;
      const nextVote = !curVote;

      const players = roomData.players || {};
      const humanIds = Object.keys(players).filter(id => !players[id].isBot);
      const updates = {};
      updates[`rooms/${currentRoomId}/finishVotes/${myId}`] = nextVote;

      const currentVotes = { ...(roomData.finishVotes || {}), [myId]: nextVote };
      const allAgreed = humanIds.length > 0 && humanIds.every(id => currentVotes[id] === true);

      if (allAgreed) {
        updates[`rooms/${currentRoomId}/status`] = "finished";
      }

      update(ref(db), updates);
    });

    function openFinishDialog() {
      modalNovelEnd.style.display = "flex";
      clearInterval(turnTimer);
      clearTimeout(botExecutionTimeout);

      const stories = roomData.stories || {};
      const fullText = Object.values(stories)
        .filter(s => !s.isSystem)
        .map(s => {
          const dur = s.durationStr ? ` [${s.durationStr}]` : "";
          return `${s.text} (${s.author}${dur})`;
        })
        .join("\n\n");

      finalNovelBody.textContent = fullText || "작성된 내용이 없습니다.";
    }

    btnSavePdf.addEventListener("click", () => {
      const stories = roomData.stories || {};
      const paragraphs = Object.values(stories)
        .filter(s => !s.isSystem)
        .map(s => {
          const dur = s.durationStr ? ` <small style="color: #888;">(${s.durationStr})</small>` : "";
          return `<p style="margin-bottom: 14px; line-height: 1.8; font-size: 11pt; color: #111;">${escapeHtml(s.text)} <small style="color:#666;">- ${escapeHtml(s.author)}${dur}</small></p>`;
        })
        .join("");

      const container = document.createElement("div");
      container.style.padding = "30px";
      container.style.fontFamily = "'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif";
      container.innerHTML = `
        <h1 style="text-align: center; margin-bottom: 6px; font-size: 20pt; color: #111;">${escapeHtml(roomData.title)}</h1>
        <p style="text-align: center; font-size: 9pt; color: #666; margin-bottom: 25px; border-bottom: 2px solid #333; padding-bottom: 10px;">
          작가진: ${Object.values(roomData.players || {}).map(p => escapeHtml(p.name)).join(", ")}
        </p>
        <div>${paragraphs}</div>
      `;

      const opt = {
        margin: [15, 15, 15, 15],
        filename: `${roomData.title}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(container).save();
    });

    // 9. 방 나가기 (봇만 남고 사람이 0명이면 방 자동 폭파)
    function leaveRoom() {
      if (currentRoomId) {
        remove(ref(db, `rooms/${currentRoomId}/players/${myId}`)).then(() => {
          const pRef = ref(db, `rooms/${currentRoomId}/players`);
          onValue(pRef, (snap) => {
            const players = snap.val() || {};
            const humanCount = Object.values(players).filter(p => !p.isBot).length;
            if (!snap.exists() || humanCount === 0) {
              remove(ref(db, `rooms/${currentRoomId}`));
            }
          }, { onlyOnce: true });
        });
      }
      cleanUpAndExit();
    }

    function cleanUpAndExit() {
      clearInterval(turnTimer);
      clearTimeout(botExecutionTimeout);
      currentRoomId = null;
      roomData = null;
      modalNovelEnd.style.display = "none";
      viewRoom.style.display = "none";
      viewLobby.style.display = "flex";
      document.body.classList.remove("panic-alert");
      panicOverlay.style.display = "none";
    }

    btnExitRoom.addEventListener("click", leaveRoom);
    btnModalExit.addEventListener("click", leaveRoom);

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
