<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>릴레이소설공포증 😱</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f0f12;
      color: #e1e1e6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    @keyframes terrorFlash {
      0% { background-color: #0f0f12; }
      50% { background-color: #7f1d1d; }
      100% { background-color: #0f0f12; }
    }
    body.panic-alert { animation: terrorFlash 0.4s ease-in-out infinite; }

    .app-card {
      width: 100%;
      max-width: 900px;
      background: #1a1a1e;
      border: 1px solid #2e2e36;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      height: 95vh;
      overflow: hidden;
      position: relative;
    }

    /* 상단 네비게이션 헤더 */
    header {
      padding: 12px 18px;
      background-color: #121215;
      border-bottom: 1px solid #2e2e36;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .brand-title {
      font-size: 1.15rem;
      color: #ff4757;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .nav-tabs {
      display: flex;
      gap: 6px;
    }
    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #a8a8b3;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .nav-btn.active {
      background: #2e2e36;
      color: #fff;
      border-color: #444;
      font-weight: bold;
    }
    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
    }
    .badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 999px;
      background: #2e2e36;
      color: #a8a8b3;
    }
    .badge-host { background: #e67e22; color: #fff; font-weight: bold; }
    .badge-bot { background: #3742fa; color: #fff; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; }

    /* 뷰 컨테이너 */
    .view-section {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow-y: auto;
      padding: 20px;
    }
    .view-section.active { display: flex; }

    /* 폼 공통 */
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    label { font-size: 0.85rem; color: #a8a8b3; font-weight: 600; }
    input, select, textarea {
      background: #121215;
      border: 1px solid #2e2e36;
      color: #fff;
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: #ff4757; }
    textarea { resize: vertical; min-height: 80px; }
    .box-panel {
      background: #24242b;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #2e2e36;
      margin-bottom: 16px;
    }
    .row { display: flex; gap: 10px; }
    .row > * { flex: 1; }

    button {
      cursor: pointer;
      border-radius: 6px;
      font-weight: 600;
      border: none;
      padding: 8px 14px;
      font-size: 0.85rem;
      transition: opacity 0.2s, background 0.2s;
    }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-danger { background: #ff4757; color: white; }
    .btn-danger:hover:not(:disabled) { background: #e84118; }
    .btn-primary { background: #2ed573; color: #0c1b11; }
    .btn-primary:hover:not(:disabled) { background: #26af5f; }
    .btn-secondary { background: #2e2e36; color: #fff; }
    .btn-secondary:hover:not(:disabled) { background: #3e3e48; }
    .btn-bot { background: #3742fa; color: #fff; padding: 6px 10px; }

    /* 방 목록 */
    .room-list { display: flex; flex-direction: column; gap: 8px; }
    .room-item {
      background: #24242b;
      padding: 12px 16px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #2e2e36;
    }

    /* 게임 룸 내부 레이아웃 */
    #view-room { padding: 0; overflow: hidden; }
    .room-topbar {
      padding: 10px 16px;
      background: #141418;
      border-bottom: 1px solid #2e2e36;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .players-list { display: flex; gap: 6px; flex-wrap: wrap; }
    .player-pill {
      background: #24242b;
      border: 1px solid #2e2e36;
      padding: 3px 8px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.75rem;
    }
    .player-pill.active-turn {
      border-color: #ff4757;
      background: #3a151b;
      color: #ff6b81;
      font-weight: bold;
    }
    .player-pill.spectator { opacity: 0.6; border-style: dashed; }

    /* 대기실 제어 바 */
    #waiting-control-panel {
      padding: 10px 16px;
      background: #1e1e24;
      border-bottom: 1px solid #2e2e36;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .host-settings-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      background: #141418;
      padding: 6px 10px;
      border-radius: 6px;
      flex-wrap: wrap;
    }
    .host-settings-bar input[type="number"] { width: 64px; padding: 4px 6px; }

    /* 소설 본문 & 리액션 플로팅 */
    .game-body-area {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }
    #story-scroll {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #121215;
    }
    .novel-card {
      background: #1e1e24;
      border-left: 3px solid #ff4757;
      padding: 10px 14px;
      border-radius: 4px;
      border: 1px solid #2e2e36;
      border-left-width: 3px;
    }
    .novel-card.sys-card { border-left-color: #e67e22; background: #2d1d13; color: #f39c12; font-size: 0.85rem; }
    .novel-card.ai-first { border-left-color: #3742fa; background: #151833; }
    .card-header {
      font-size: 0.75rem;
      color: #8d8d99;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }

    /* 사이드 채팅/댓글창 */
    .side-chat-pane {
      width: 260px;
      background: #18181d;
      border-left: 1px solid #2e2e36;
      display: flex;
      flex-direction: column;
    }
    .chat-messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.8rem;
    }
    .chat-msg { background: #22222a; padding: 4px 8px; border-radius: 4px; }
    .chat-msg strong { color: #2ed573; margin-right: 4px; }
    .chat-input-row { display: flex; padding: 8px; gap: 4px; border-top: 1px solid #2e2e36; }

    /* 리액션 이모지 바 */
    .reaction-bar {
      display: flex;
      gap: 6px;
      padding: 6px 16px;
      background: #141418;
      border-top: 1px solid #26262e;
      align-items: center;
    }
    .reaction-bar span { font-size: 0.75rem; color: #888; }
    .emoji-btn {
      background: transparent;
      border: none;
      font-size: 1.2rem;
      padding: 2px 6px;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .emoji-btn:hover { transform: scale(1.3); }

    /* 플로팅 리액션 애니메이션 */
    .floating-emoji {
      position: absolute;
      bottom: 60px;
      right: 280px;
      font-size: 2rem;
      pointer-events: none;
      animation: floatUp 1.5s ease-out forwards;
      z-index: 30;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-120px) scale(1.5); }
    }

    /* 하단 입력 독 */
    #bottom-dock {
      padding: 10px 16px;
      background: #141418;
      border-top: 1px solid #2e2e36;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .live-status-bar {
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 도서관 목록 */
    .library-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }
    .library-card {
      background: #24242b;
      border: 1px solid #2e2e36;
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
    }
    .library-card:hover { border-color: #2ed573; }
    .author-link { color: #2ed573; text-decoration: underline; cursor: pointer; }

    /* 모달 */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 60;
    }
    .modal-content {
      background: #1a1a1e;
      border: 1px solid #2e2e36;
      border-radius: 8px;
      padding: 20px;
      width: 100%;
      max-width: 580px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #panic-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(180, 0, 0, 0.45);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 55;
      pointer-events: none;
    }
    #panic-overlay .emoji { font-size: 4.5rem; filter: drop-shadow(0 0 15px #ff0000); }
  </style>
</head>
<body>

  <!-- 시간 초과 패닉 경고 -->
  <div id="panic-overlay">
    <div class="emoji">😱</div>
    <h2 style="color:#fff; margin-top:10px;">시간 초과! 경고 1회 적립!</h2>
  </div>

  <div class="app-card">
    <!-- 상단 네비게이션 -->
    <header>
      <div class="brand-title" id="nav-brand">릴레이소설공포증 😱</div>
      <div class="nav-tabs">
        <button class="nav-btn active" id="tab-btn-lobby">로비</button>
        <button class="nav-btn" id="tab-btn-library">도서관 📚</button>
        <button class="nav-btn" id="tab-btn-profile">내 작가프로필</button>
      </div>
      <div class="user-pill">
        <span id="header-user-badge" class="badge">로그인 필요</span>
        <button id="btn-auth-action" class="btn-secondary" style="padding:4px 8px; font-size:0.75rem;">로그인</button>
      </div>
    </header>

    <!-- [뷰 1: 로비 화면] -->
    <div id="view-lobby" class="view-section active">
      <div class="box-panel">
        <label style="font-size:1rem; color:#fff;">새 방 개설</label>
        <div style="margin-top:10px; display:flex; flex-direction:column; gap:10px;">
          <input type="text" id="create-room-title" placeholder="방 제목 입력">
          <div class="row">
            <div>
              <label>모드</label>
              <select id="create-room-mode">
                <option value="infinite">무한 모드</option>
                <option value="timed">시간제한 모드</option>
              </select>
            </div>
            <div>
              <label>최대 인원수 (0: 무제한)</label>
              <input type="number" id="create-max-players" value="0" min="0" max="99">
            </div>
          </div>
          <div class="row" id="create-timed-row" style="display:none;">
            <div>
              <label>턴 제한 (초)</label>
              <input type="number" id="create-turn-seconds" value="30" min="5" max="300">
            </div>
            <div>
              <label>전체 제한 (분)</label>
              <input type="number" id="create-total-minutes" value="5" min="1" max="120">
            </div>
          </div>
          <label style="display:flex; align-items:center; gap:6px; cursor:pointer; font-size:0.85rem;">
            <input type="checkbox" id="create-ai-first" checked> AI 첫 문장 실시간 생성
          </label>
          <button id="btn-create-room" class="btn-danger">방 만들기</button>
        </div>
      </div>

      <div class="form-group" style="flex:1;">
        <label>진행 / 대기 중인 방</label>
        <div id="room-list" class="room-list">
          <p style="color: #666; font-size: 0.85rem;">개설된 방이 없습니다.</p>
        </div>
      </div>
    </div>

    <!-- [뷰 2: 게임 룸 화면] -->
    <div id="view-room" class="view-section">
      <div class="room-topbar">
        <div>
          <strong id="room-title-label">방 제목</strong>
          <span id="room-mode-tag" class="badge">모드</span>
          <span id="room-limit-tag" class="badge">인원</span>
        </div>
        <div class="players-list" id="room-players-list"></div>
      </div>

      <!-- 대기실 패널 -->
      <div id="waiting-control-panel">
        <div id="host-settings-area" class="host-settings-bar" style="display:none;">
          <span class="badge badge-host">방장</span>
          <select id="live-mode-select">
            <option value="infinite">무한</option>
            <option value="timed">시간제한</option>
          </select>
          <div id="live-timed-options" style="display:flex; gap:4px; align-items:center;">
            <input type="number" id="live-turn-input" min="5" max="300" title="턴 제한(초)">초
            <input type="number" id="live-total-input" min="1" max="120" title="전체 제한(분)">분
          </div>
          <input type="number" id="live-max-players-input" min="0" max="99" style="width:55px;" title="최대 인원(0은 무제한)">명
          <label style="font-size:0.8rem; margin-left:6px;"><input type="checkbox" id="live-ai-first-toggle"> AI첫줄</label>
        </div>

        <!-- 봇 추가 바 (방장 전용) -->
        <div id="host-bot-bar" style="display:none; gap:6px; align-items:center;">
          <span class="badge badge-bot">AI봇 초대</span>
          <select id="select-bot-persona" style="padding:4px 8px; font-size:0.8rem;">
            <option value="choding">초딩작가</option>
            <option value="shakespeare">셰익스피어</option>
            <option value="spicy_webnovel">성인웹소설작가</option>
            <option value="hardboiled">하드보일드 탐정</option>
            <option value="k_fantasy">K-판타지 작가</option>
            <option value="cyberpunk">사이버펑크 해커</option>
            <option value="occult">오컬트 괴담 수집가</option>
            <option value="makjang">막장 아침드라마</option>
          </select>
          <button id="btn-add-bot" class="btn-bot">+ 봇 추가</button>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span id="waiting-info-text" style="font-size: 0.8rem; color: #a8a8b3;"></span>
          <div style="display: flex; gap: 6px;">
            <button id="btn-ready-toggle" class="btn-primary">레디</button>
            <button id="btn-host-start" class="btn-danger" style="display: none;" disabled>시작</button>
            <button id="btn-exit-room" class="btn-secondary">나가기</button>
          </div>
        </div>
      </div>

      <!-- 본문 + 사이드 댓글 영역 -->
      <div class="game-body-area">
        <div id="story-scroll"></div>
        <div class="side-chat-pane">
          <div style="padding:6px 10px; font-size:0.75rem; border-bottom:1px solid #2e2e36; color:#a8a8b3;">관전 댓글 및 반응</div>
          <div class="chat-messages" id="chat-messages-box"></div>
          <form id="chat-form" class="chat-input-row">
            <input type="text" id="chat-input" placeholder="댓글 입력..." style="flex:1; padding:4px 8px; font-size:0.8rem;" autocomplete="off">
            <button type="submit" class="btn-secondary" style="padding:4px 8px; font-size:0.75rem;">전송</button>
          </form>
        </div>
      </div>

      <!-- 실시간 이모지 리액션 바 -->
      <div class="reaction-bar">
        <span>리액션:</span>
        <button class="emoji-btn" data-emoji="😱">😱</button>
        <button class="emoji-btn" data-emoji="👏">👏</button>
        <button class="emoji-btn" data-emoji="🔥">🔥</button>
        <button class="emoji-btn" data-emoji="😂">😂</button>
        <button class="emoji-btn" data-emoji="💀">💀</button>
        <div style="flex:1;"></div>
        <button id="btn-give-up" class="btn-secondary" style="font-size:0.75rem; display:none; background:#572323;">도중하차</button>
        <button id="btn-interrupt-join" class="btn-danger" style="font-size:0.75rem; display:none;">끼어들기! 신청</button>
      </div>

      <!-- 하단 입력 독 -->
      <div id="bottom-dock">
        <div class="live-status-bar">
          <span id="turn-message">대기 중</span>
          <span id="time-left-tag" style="color: #ff6b81; font-weight: bold;"></span>
          <button id="btn-vote-finish" class="btn-secondary" style="font-size: 0.75rem;">소설 완결 (0/0)</button>
        </div>
        <form id="novel-input-form" class="row">
          <input type="text" id="novel-text-input" placeholder="문장을 입력하세요..." autocomplete="off" disabled>
          <button type="submit" id="btn-submit-sentence" class="btn-danger" style="flex: 0 0 90px;" disabled>등록</button>
        </form>
      </div>
    </div>

    <!-- [뷰 3: 도서관 (게시판)] -->
    <div id="view-library" class="view-section">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h2 style="font-size:1.1rem; color:#fff;">완성된 작품 도서관 📚</h2>
        <span style="font-size:0.8rem; color:#888;">전원 동의를 거쳐 출판된 명작들입니다.</span>
      </div>
      <div id="library-container" class="library-grid">
        <p style="color:#666; font-size:0.85rem;">출판된 소설이 없습니다.</p>
      </div>
    </div>

    <!-- [뷰 4: 작가 프로필] -->
    <div id="view-profile" class="view-section">
      <div class="box-panel">
        <h2 id="prof-display-name" style="font-size:1.2rem; color:#2ed573; margin-bottom:8px;">작가 프로필</h2>
        <div class="form-group">
          <label>자기소개</label>
          <textarea id="prof-bio-input" placeholder="자신을 표현하는 작가 소개글을 남겨보세요."></textarea>
        </div>
        <button id="btn-save-profile" class="btn-primary" style="align-self:flex-start;">소개글 저장</button>
      </div>

      <div class="box-panel">
        <h3 style="font-size:0.95rem; color:#fff; margin-bottom:10px;">참여하여 출판된 소설 작품</h3>
        <div id="prof-novel-list" class="room-list">
          <p style="color:#666; font-size:0.85rem;">아직 출판된 참여작이 없습니다.</p>
        </div>
      </div>
    </div>

    <!-- 완결 및 도서관 게시 투표 모달 -->
    <div id="modal-novel-end" class="modal-overlay">
      <div class="modal-content">
        <h2 style="color: #2ed573; font-size: 1.15rem;">소설 완성</h2>
        <div id="final-novel-body" style="background:#121215; padding:12px; border-radius:6px; max-height:40vh; overflow-y:auto; font-size:0.9rem; line-height:1.6; white-space:pre-wrap;"></div>
        <div style="background:#24242b; padding:10px; border-radius:6px; font-size:0.85rem;">
          <strong>도서관 게시판 출판 투표 (전원 동의 필요):</strong>
          <div id="publish-vote-status" style="margin-top:4px; color:#aaa;">찬성: 0명</div>
          <button id="btn-vote-publish" class="btn-primary" style="margin-top:6px; padding:4px 10px; font-size:0.8rem;">도서관 게시 찬성</button>
        </div>
        <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top:6px;">
          <button id="btn-save-pdf" class="btn-primary">PDF 다운로드</button>
          <button id="btn-modal-exit" class="btn-secondary">나가기</button>
        </div>
      </div>
    </div>

    <!-- 로그인/회원가입 모달 -->
    <div id="modal-auth" class="modal-overlay">
      <div class="modal-content" style="max-width:360px;">
        <h2 id="auth-modal-title" style="font-size:1.1rem; color:#fff;">로그인</h2>
        <div class="form-group">
          <label>아이디</label>
          <input type="text" id="auth-id-input" placeholder="영문/숫자 아이디">
        </div>
        <div class="form-group">
          <label>비밀번호</label>
          <input type="password" id="auth-pw-input" placeholder="비밀번호">
        </div>
        <div class="form-group" id="auth-nick-group" style="display:none;">
          <label>작가 닉네임</label>
          <input type="text" id="auth-nick-input" placeholder="작가명">
        </div>
        <div style="display:flex; gap:6px; margin-top:6px;">
          <button id="btn-auth-submit" class="btn-danger" style="flex:1;">로그인</button>
          <button id="btn-auth-switch" class="btn-secondary" style="font-size:0.75rem;">회원가입으로</button>
        </div>
        <button id="btn-auth-close" class="btn-secondary" style="margin-top:4px; padding:4px;">닫기</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { 
      getDatabase, ref, set, push, onValue, update, remove, onDisconnect, get 
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBsvhq6Y1KzvUJ9gUlF6_QEgYoj-FzuZMU",
      authDomain: "relaynovelphobia.firebaseapp.com",
      databaseURL: "https://relaynovelphobia-default-rtdb.firebaseio.com",
      projectId: "relaynovelphobia",
      storageBucket: "relaynovelphobia.firebasestorage.app",
      messagingSenderId: "365170091282",
      appId: "1:365170091282:web:6956889d54eea4070bbfcb",
      measurementId: "G-Q9LHNRX3T0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const BOT_PERSONAS = {
      choding: { name: "초딩작가", instruction: "초등학생 말투, 유치하고 엉뚱한 반전, 'ㅋㅋ'나 'ㄷㄷ' 사용." },
      shakespeare: { name: "셰익스피어", instruction: "비극적이고 웅장한 고전문학 어조, 철학적 은유와 운명 독백." },
      spicy_webnovel: { name: "성인웹소설작가", instruction: "치명적인 긴장감, 도발적이고 아찔한 숨결, 매운맛 로맨스." },
      hardboiled: { name: "하드보일드 탐정", instruction: "냉소적인 느와르, 빗소리, 담배 연기와 리볼버, 비정한 어조." },
      k_fantasy: { name: "K-판타지 작가", instruction: "[상태창 알림], 헌터 각성, 마나와 차원 균열, 빠른 전개." },
      cyberpunk: { name: "사이버펑크 해커", instruction: "네온사인 디스토피아, 뉴런 링크, 암호화 패킷, 기계 의수." },
      occult: { name: "오컬트 괴담 수집가", instruction: "불길한 금기, 뒤틀린 형체, 서늘한 공포와 기괴한 소리." },
      makjang: { name: "막장 아침드라마", instruction: "출생의 비밀, 유전자 검사, 배신, 물세례와 격정적인 외침." }
    };

    // 사용자 계정 상태
    let currentUser = JSON.parse(localStorage.getItem("rnp_auth_user") || "null");
    let currentRoomId = null;
    let roomData = null;
    let turnTimer = null;
    let panicTimeout = null;
    let botExecutionTimeout = null;

    // 네비게이션 DOM
    const navTabs = {
      lobby: document.getElementById("tab-btn-lobby"),
      library: document.getElementById("tab-btn-library"),
      profile: document.getElementById("tab-btn-profile")
    };
    const views = {
      lobby: document.getElementById("view-lobby"),
      room: document.getElementById("view-room"),
      library: document.getElementById("view-library"),
      profile: document.getElementById("view-profile")
    };
    const headerUserBadge = document.getElementById("header-user-badge");
    const btnAuthAction = document.getElementById("btn-auth-action");

    // 방 만들기 관련 DOM
    const createRoomTitle = document.getElementById("create-room-title");
    const createRoomMode = document.getElementById("create-room-mode");
    const createMaxPlayers = document.getElementById("create-max-players");
    const createTimedRow = document.getElementById("create-timed-row");
    const createTurnSeconds = document.getElementById("create-turn-seconds");
    const createTotalMinutes = document.getElementById("create-total-minutes");
    const createAiFirst = document.getElementById("create-ai-first");
    const btnCreateRoom = document.getElementById("btn-create-room");
    const roomList = document.getElementById("room-list");

    // 방 내부 DOM
    const roomTitleLabel = document.getElementById("room-title-label");
    const roomModeTag = document.getElementById("room-mode-tag");
    const roomLimitTag = document.getElementById("room-limit-tag");
    const roomPlayersList = document.getElementById("room-players-list");
    const waitingControlPanel = document.getElementById("waiting-control-panel");
    const hostSettingsArea = document.getElementById("host-settings-area");
    const liveModeSelect = document.getElementById("live-mode-select");
    const liveTimedOptions = document.getElementById("live-timed-options");
    const liveTurnInput = document.getElementById("live-turn-input");
    const liveTotalInput = document.getElementById("live-total-input");
    const liveMaxPlayersInput = document.getElementById("live-max-players-input");
    const liveAiFirstToggle = document.getElementById("live-ai-first-toggle");
    const hostBotBar = document.getElementById("host-bot-bar");
    const selectBotPersona = document.getElementById("select-bot-persona");
    const btnAddBot = document.getElementById("btn-add-bot");
    const waitingInfoText = document.getElementById("waiting-info-text");
    const btnReadyToggle = document.getElementById("btn-ready-toggle");
    const btnHostStart = document.getElementById("btn-host-start");
    const btnExitRoom = document.getElementById("btn-exit-room");
    const storyScroll = document.getElementById("story-scroll");
    const turnMessage = document.getElementById("turn-message");
    const timeLeftTag = document.getElementById("time-left-tag");
    const btnVoteFinish = document.getElementById("btn-vote-finish");
    const novelInputForm = document.getElementById("novel-input-form");
    const novelTextInput = document.getElementById("novel-text-input");
    const btnSubmitSentence = document.getElementById("btn-submit-sentence");
    const btnGiveUp = document.getElementById("btn-give-up");
    const btnInterruptJoin = document.getElementById("btn-interrupt-join");
    const chatMessagesBox = document.getElementById("chat-messages-box");
    const chatForm = document.getElementById("chat-form");
    const chatInput = document.getElementById("chat-input");

    // 도서관 & 프로필 DOM
    const libraryContainer = document.getElementById("library-container");
    const profDisplayName = document.getElementById("prof-display-name");
    const profBioInput = document.getElementById("prof-bio-input");
    const btnSaveProfile = document.getElementById("btn-save-profile");
    const profNovelList = document.getElementById("prof-novel-list");

    // 모달 DOM
    const modalAuth = document.getElementById("modal-auth");
    const authIdInput = document.getElementById("auth-id-input");
    const authPwInput = document.getElementById("auth-pw-input");
    const authNickGroup = document.getElementById("auth-nick-group");
    const authNickInput = document.getElementById("auth-nick-input");
    const btnAuthSubmit = document.getElementById("btn-auth-submit");
    const btnAuthSwitch = document.getElementById("btn-auth-switch");
    const btnAuthClose = document.getElementById("btn-auth-close");
    const authModalTitle = document.getElementById("auth-modal-title");
    let isSignupMode = false;

    const modalNovelEnd = document.getElementById("modal-novel-end");
    const finalNovelBody = document.getElementById("final-novel-body");
    const publishVoteStatus = document.getElementById("publish-vote-status");
    const btnVotePublish = document.getElementById("btn-vote-publish");
    const btnSavePdf = document.getElementById("btn-save-pdf");
    const btnModalExit = document.getElementById("btn-modal-exit");
    const panicOverlay = document.getElementById("panic-overlay");

    // 1. 네비게이션 탭 전환
    function switchTab(tabName) {
      if (currentRoomId && tabName !== "room") {
        if (!confirm("진행 중인 방에서 나가시겠습니까?")) return;
        leaveRoom();
      }
      Object.keys(views).forEach(k => views[k].classList.remove("active"));
      Object.keys(navTabs).forEach(k => navTabs[k].classList.remove("active"));
      if (views[tabName]) views[tabName].classList.add("active");
      if (navTabs[tabName]) navTabs[tabName].classList.add("active");

      if (tabName === "library") loadLibrary();
      if (tabName === "profile") loadProfile(currentUser ? currentUser.id : null);
    }

    navTabs.lobby.addEventListener("click", () => switchTab("lobby"));
    navTabs.library.addEventListener("click", () => switchTab("library"));
    navTabs.profile.addEventListener("click", () => switchTab("profile"));
    document.getElementById("nav-brand").addEventListener("click", () => switchTab("lobby"));

    // 2. 인증/로그인 관리
    function updateAuthUI() {
      if (currentUser) {
        headerUserBadge.textContent = `${currentUser.nickname} 작가`;
        btnAuthAction.textContent = "로그아웃";
      } else {
        headerUserBadge.textContent = "로그인 필요";
        btnAuthAction.textContent = "로그인";
      }
    }
    updateAuthUI();

    btnAuthAction.addEventListener("click", () => {
      if (currentUser) {
        currentUser = null;
        localStorage.removeItem("rnp_auth_user");
        updateAuthUI();
        switchTab("lobby");
      } else {
        openAuthModal(false);
      }
    });

    function openAuthModal(signup = false) {
      isSignupMode = signup;
      authModalTitle.textContent = isSignupMode ? "회원가입" : "로그인";
      btnAuthSubmit.textContent = isSignupMode ? "가입 완료" : "로그인";
      btnAuthSwitch.textContent = isSignupMode ? "로그인으로" : "회원가입으로";
      authNickGroup.style.display = isSignupMode ? "flex" : "none";
      authIdInput.value = "";
      authPwInput.value = "";
      authNickInput.value = "";
      modalAuth.style.display = "flex";
    }

    btnAuthSwitch.addEventListener("click", () => openAuthModal(!isSignupMode));
    btnAuthClose.addEventListener("click", () => modalAuth.style.display = "none");

    btnAuthSubmit.addEventListener("click", async () => {
      const uId = authIdInput.value.trim();
      const pw = authPwInput.value.trim();
      if (!uId || !pw) return alert("아이디와 비밀번호를 입력해주세요.");

      const userRef = ref(db, `users/${uId}`);
      const snap = await get(userRef);

      if (isSignupMode) {
        if (snap.exists()) return alert("이미 존재하는 아이디입니다.");
        const nick = authNickInput.value.trim() || uId;
        const newUserData = { id: uId, pw: pw, nickname: nick, bio: "반갑습니다! 릴레이소설 작가입니다." };
        await set(userRef, newUserData);
        currentUser = newUserData;
        localStorage.setItem("rnp_auth_user", JSON.stringify(currentUser));
        modalAuth.style.display = "none";
        updateAuthUI();
        alert("회원가입이 완료되었습니다!");
      } else {
        if (!snap.exists() || snap.val().pw !== pw) return alert("아이디 또는 비밀번호가 틀렸습니다.");
        currentUser = snap.val();
        localStorage.setItem("rnp_auth_user", JSON.stringify(currentUser));
        modalAuth.style.display = "none";
        updateAuthUI();
      }
    });

    function requireLogin() {
      if (!currentUser) {
        openAuthModal(false);
        return false;
      }
      return true;
    }

    // 3. 방 생성 & 로비
    createRoomMode.addEventListener("change", () => {
      createTimedRow.style.display = (createRoomMode.value === "timed") ? "flex" : "none";
    });

    btnCreateRoom.addEventListener("click", () => {
      if (!requireLogin()) return;
      const title = createRoomTitle.value.trim() || "릴레이 소설";
      const mode = createRoomMode.value;
      const maxPlayers = parseInt(createMaxPlayers.value, 10) || 0;
      const turnLimit = Math.max(5, parseInt(createTurnSeconds.value, 10) || 30);
      const totalLimit = Math.max(1, parseInt(createTotalMinutes.value, 10) || 5);
      const useAiFirst = createAiFirst.checked;

      const newRef = push(ref(db, "rooms"));
      const rId = newRef.key;

      const newRoom = {
        title: title,
        mode: mode,
        maxPlayers: maxPlayers,
        turnLimit: turnLimit,
        totalLimit: totalLimit,
        useAiFirst: useAiFirst,
        status: "waiting",
        hostId: currentUser.id,
        currentTurnIndex: 0,
        playerOrder: [currentUser.id],
        turnStartTime: 0,
        gameStartTime: 0,
        finishVotes: {},
        publishVotes: {},
        interruptVotes: {},
        players: {
          [currentUser.id]: {
            id: currentUser.id,
            name: currentUser.nickname,
            isReady: false,
            penalties: 0,
            isBot: false,
            isSpectator: false,
            joinedAt: Date.now()
          }
        },
        stories: {},
        chats: {}
      };

      set(newRef, newRoom).then(() => joinRoom(rId));
    });

    // 로비 방 목록 동기화
    onValue(ref(db, "rooms"), (snapshot) => {
      const rooms = snapshot.val();
      roomList.innerHTML = "";
      if (!rooms) {
        roomList.innerHTML = `<p style="color:#666; font-size:0.85rem;">개설된 방이 없습니다.</p>`;
        return;
      }
      Object.keys(rooms).forEach((rId) => {
        const r = rooms[rId];
        const pList = r.players ? Object.values(r.players) : [];
        const humanCount = pList.filter(p => !p.isBot).length;

        // 인간이 0명이면 방 자동 삭제
        if (humanCount === 0) {
          remove(ref(db, `rooms/${rId}`));
          return;
        }

        const maxStr = r.maxPlayers > 0 ? `${pList.length}/${r.maxPlayers}명` : `${pList.length}명 (무제한)`;
        const div = document.createElement("div");
        div.className = "room-item";
        div.innerHTML = `
          <div>
            <strong>${escapeHtml(r.title)}</strong>
            <div style="font-size:0.8rem; color:#a8a8b3; margin-top:4px;">
              ${r.mode === "timed" ? `시간제한 (${r.turnLimit}초/${r.totalLimit}분)` : "무한"} · 인원: ${maxStr} · ${r.status === "playing" ? "집필중" : "대기"}
            </div>
          </div>
          <button class="btn-danger" style="padding:6px 14px; font-size:0.85rem;">입장</button>
        `;
        div.querySelector("button").addEventListener("click", () => joinRoom(rId));
        roomList.appendChild(div);
      });
    });

    // 4. 방 입장
    async function joinRoom(rId) {
      if (!requireLogin()) return;
      currentRoomId = rId;

      const rSnap = await get(ref(db, `rooms/${rId}`));
      if (!rSnap.exists()) return alert("존재하지 않는 방입니다.");
      const rVal = rSnap.val();
      const pList = Object.values(rVal.players || {});

      // 최대 인원수 초과 검사 (0은 무제한)
      if (rVal.maxPlayers > 0 && pList.length >= rVal.maxPlayers && !rVal.players[currentUser.id]) {
        return alert("방의 정원이 가득 찼습니다.");
      }

      // 이미 진행 중인 방이면 기본 '관전자'로 입장
      const isSpectator = (rVal.status === "playing");
      const playerRef = ref(db, `rooms/${rId}/players/${currentUser.id}`);

      await update(playerRef, {
        id: currentUser.id,
        name: currentUser.nickname,
        isReady: false,
        penalties: 0,
        isBot: false,
        isSpectator: isSpectator,
        joinedAt: Date.now()
      });

      onDisconnect(playerRef).remove();

      switchView("room");
      listenToRoom(rId);
    }

    function switchView(viewName) {
      Object.keys(views).forEach(k => views[k].classList.remove("active"));
      views[viewName].classList.add("active");
    }

    // 5. 방 데이터 구독 및 실시간 동기화
    function listenToRoom(rId) {
      const roomRef = ref(db, `rooms/${rId}`);
      onValue(roomRef, (snapshot) => {
        roomData = snapshot.val();
        if (!roomData) {
          cleanUpAndExit();
          return;
        }

        const players = roomData.players || {};
        const pIds = Object.keys(players);
        const humanIds = pIds.filter(id => !players[id].isBot);

        // 사람이 0명이면 방 즉시 폭파
        if (humanIds.length === 0) {
          remove(roomRef);
          cleanUpAndExit();
          return;
        }

        // 방장 자동 계승 (인간 중 가장 오래된 참가자)
        let hostId = humanIds[0];
        let oldestTime = players[hostId].joinedAt || 0;
        humanIds.forEach(id => {
          if (players[id].joinedAt && players[id].joinedAt < oldestTime) {
            oldestTime = players[id].joinedAt;
            hostId = id;
          }
        });

        if (roomData.hostId !== hostId && hostId === currentUser.id) {
          update(roomRef, { hostId: hostId });
        }

        renderRoomUI(hostId, pIds);
      });
    }

    // 6. 게임 룸 렌더링
    function renderRoomUI(hostId, pIds) {
      const isHost = (currentUser && currentUser.id === hostId);
      const players = roomData.players || {};
      const myInfo = players[currentUser.id];

      roomTitleLabel.textContent = roomData.title;
      roomModeTag.textContent = roomData.mode === "timed" ? `${roomData.turnLimit}초/${roomData.totalLimit}분` : "무한";
      roomLimitTag.textContent = roomData.maxPlayers > 0 ? `정원 ${roomData.maxPlayers}명` : "무제한";

      // 플레이어 칩 렌더링
      roomPlayersList.innerHTML = "";
      const currentTurnId = (roomData.playerOrder && roomData.playerOrder.length > 0)
        ? roomData.playerOrder[roomData.currentTurnIndex % roomData.playerOrder.length]
        : null;

      pIds.forEach(pId => {
        const p = players[pId];
        const chip = document.createElement("div");
        chip.className = "player-pill";
        if (p.isSpectator) chip.classList.add("spectator");
        if (roomData.status === "playing" && pId === currentTurnId) chip.classList.add("active-turn");

        let roleTag = "";
        if (pId === hostId) roleTag = '<span class="badge badge-host" style="font-size:0.6rem;">방장</span>';
        else if (p.isBot) roleTag = '<span class="badge badge-bot">BOT</span>';
        else if (p.isSpectator) roleTag = '<span style="color:#888;">[관전]</span>';
        else if (roomData.status === "waiting") roleTag = `<span style="color:${p.isReady ? '#2ed573' : '#666'};">${p.isReady ? '레디' : '대기'}</span>`;

        chip.innerHTML = `
          ${roleTag}
          <span>${escapeHtml(p.name)}</span>
          ${p.penalties > 0 ? `<span style="color:#ff4757; font-weight:bold;">⚠️${p.penalties}</span>` : ''}
          ${isHost && p.isBot && roomData.status === "waiting" ? `<span style="cursor:pointer; color:#ff4757; margin-left:3px;" title="추방">×</span>` : ''}
        `;

        if (isHost && p.isBot && roomData.status === "waiting") {
          chip.querySelector("span[title='추방']").addEventListener("click", () => {
            remove(ref(db, `rooms/${currentRoomId}/players/${pId}`));
          });
        }
        roomPlayersList.appendChild(chip);
      });

      // 대기실 / 진행 중 UI 분기
      if (roomData.status === "waiting") {
        waitingControlPanel.style.display = "flex";
        btnGiveUp.style.display = "none";
        btnInterruptJoin.style.display = "none";
        novelInputForm.style.display = "none";
        storyScroll.style.display = "none";
        clearInterval(turnTimer);
        clearTimeout(botExecutionTimeout);
        timeLeftTag.textContent = "";

        if (isHost) {
          hostSettingsArea.style.display = "flex";
          hostBotBar.style.display = "flex";
          liveModeSelect.value = roomData.mode;
          liveTimedOptions.style.display = (roomData.mode === "timed") ? "flex" : "none";
          liveAiFirstToggle.checked = roomData.useAiFirst ?? true;
          if (document.activeElement !== liveTurnInput) liveTurnInput.value = roomData.turnLimit;
          if (document.activeElement !== liveTotalInput) liveTotalInput.value = roomData.totalLimit;
          if (document.activeElement !== liveMaxPlayersInput) liveMaxPlayersInput.value = roomData.maxPlayers;

          btnHostStart.style.display = "inline-block";
          btnReadyToggle.style.display = "none";

          const nonHostHuman = pIds.filter(id => id !== hostId && !players[id].isBot);
          const allReady = nonHostHuman.length === 0 || nonHostHuman.every(id => players[id].isReady);
          btnHostStart.disabled = !allReady;
          waitingInfoText.textContent = allReady ? "모든 작가 준비 완료! 시작 가능" : "참가자 레디 대기 중";
        } else {
          hostSettingsArea.style.display = "none";
          hostBotBar.style.display = "none";
          btnHostStart.style.display = "none";
          btnReadyToggle.style.display = "inline-block";
          const myReady = myInfo?.isReady || false;
          btnReadyToggle.textContent = myReady ? "준비 취소" : "레디";
          btnReadyToggle.style.background = myReady ? "#ff4757" : "#2ed573";
          waitingInfoText.textContent = myReady ? "방장의 시작을 기다리고 있습니다." : "준비가 되면 레디를 눌러주세요.";
        }
      } else if (roomData.status === "playing") {
        waitingControlPanel.style.display = "none";
        storyScroll.style.display = "flex";
        novelInputForm.style.display = "flex";

        // 관전자/작성자 버튼 분기
        if (myInfo?.isSpectator) {
          btnGiveUp.style.display = "none";
          btnInterruptJoin.style.display = "inline-block";
        } else {
          btnGiveUp.style.display = "inline-block";
          btnInterruptJoin.style.display = "none";
        }

        renderStoryFeed();
        renderChatFeed();
        runTurnTimerLoop(currentTurnId, hostId);

        // 봇 차례일 경우 방장 기기에서 LLM 작문 실행
        if (players[currentTurnId]?.isBot && isHost) {
          scheduleLiveLlmBotTurn(currentTurnId);
        }
      } else if (roomData.status === "finished") {
        openFinishDialog();
      }

      // 완결 투표 현황
      const finishVotes = roomData.finishVotes || {};
      const activeWriters = (roomData.playerOrder || []).filter(id => players[id] && !players[id].isBot);
      const agreeCount = activeWriters.filter(id => finishVotes[id] === true).length;
      btnVoteFinish.textContent = `소설 완결 (${agreeCount}/${activeWriters.length})`;
      btnVoteFinish.style.background = finishVotes[currentUser.id] ? "#2ed573" : "#2e2e36";
    }

    // 대기실 실시간 설정 변경
    liveModeSelect.addEventListener("change", () => update(ref(db, `rooms/${currentRoomId}`), { mode: liveModeSelect.value }));
    liveTurnInput.addEventListener("change", () => update(ref(db, `rooms/${currentRoomId}`), { turnLimit: Math.max(5, parseInt(liveTurnInput.value,10)||30) }));
    liveTotalInput.addEventListener("change", () => update(ref(db, `rooms/${currentRoomId}`), { totalLimit: Math.max(1, parseInt(liveTotalInput.value,10)||5) }));
    liveMaxPlayersInput.addEventListener("change", () => update(ref(db, `rooms/${currentRoomId}`), { maxPlayers: Math.max(0, parseInt(liveMaxPlayersInput.value,10)||0) }));
    liveAiFirstToggle.addEventListener("change", () => update(ref(db, `rooms/${currentRoomId}`), { useAiFirst: liveAiFirstToggle.checked }));

    // 봇 추가
    btnAddBot.addEventListener("click", () => {
      const personaKey = selectBotPersona.value;
      const preset = BOT_PERSONAS[personaKey];
      const botId = "bot_" + personaKey + "_" + Math.random().toString(36).substring(2, 7);
      set(ref(db, `rooms/${currentRoomId}/players/${botId}`), {
        id: botId,
        name: `${preset.name}🤖`,
        persona: personaKey,
        isBot: true,
        isReady: true,
        isSpectator: false,
        penalties: 0,
        joinedAt: Date.now()
      });
    });

    btnReadyToggle.addEventListener("click", () => {
      const cur = roomData.players[currentUser.id]?.isReady || false;
      update(ref(db, `rooms/${currentRoomId}/players/${currentUser.id}`), { isReady: !cur });
    });

    // 시작 (방장)
    btnHostStart.addEventListener("click", async () => {
      const pList = Object.values(roomData.players || {});
      const activeIds = pList.filter(p => !p.isSpectator).map(p => p.id);
      const now = Date.now();
      const updates = {};

      updates[`rooms/${currentRoomId}/status`] = "playing";
      updates[`rooms/${currentRoomId}/playerOrder`] = activeIds;
      updates[`rooms/${currentRoomId}/currentTurnIndex`] = 0;
      updates[`rooms/${currentRoomId}/turnStartTime`] = now;
      updates[`rooms/${currentRoomId}/gameStartTime`] = now;

      if (roomData.useAiFirst) {
        let firstSentence = "";
        try {
          const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(roomData.title + " 소설의 시작 첫 문장을 기괴하고 흥미롭게 1문장만 한국어로 작성해라.")}`);
          if (res.ok) firstSentence = cleanLlmText(await res.text());
        } catch (e) {}
        if (!firstSentence) firstSentence = "아무도 없는 한밤중, 책상 서랍 안쪽에서 서늘한 숨소리가 새어 나왔다.";

        const sRef = push(ref(db, `rooms/${currentRoomId}/stories`));
        updates[`rooms/${currentRoomId}/stories/${sRef.key}`] = {
          author: "AI 프롬프트",
          text: firstSentence,
          isSystem: false,
          isAiFirst: true,
          durationStr: "자동생성",
          timestamp: now
        };
      }
      update(ref(db), updates);
    });

    // 7. 도중하차 & 끼어들기 전원 동의 시스템
    btnGiveUp.addEventListener("click", () => {
      if (!confirm("정말 도중하차하시겠습니까? 관전자 상태로 전환되며 차례에서 제외됩니다.")) return;
      const curOrder = roomData.playerOrder || [];
      const newOrder = curOrder.filter(id => id !== currentUser.id);

      const updates = {};
      updates[`rooms/${currentRoomId}/players/${currentUser.id}/isSpectator`] = true;
      updates[`rooms/${currentRoomId}/playerOrder`] = newOrder;

      const sRef = push(ref(db, `rooms/${currentRoomId}/stories`));
      updates[`rooms/${currentRoomId}/stories/${sRef.key}`] = {
        author: "SYSTEM",
        text: `🚪 [${currentUser.nickname}] 님이 도중하차하여 관전 모드로 전환되었습니다.`,
        isSystem: true,
        timestamp: Date.now()
      };
      update(ref(db), updates);
    });

    btnInterruptJoin.addEventListener("click", () => {
      if (!confirm("끼어들기를 신청하시겠습니까? 현재 집필 중인 모든 작가의 동의가 필요합니다.")) return;
      const updates = {};
      updates[`rooms/${currentRoomId}/interruptReq`] = {
        requesterId: currentUser.id,
        requesterName: currentUser.nickname,
        votes: { [currentUser.id]: true },
        timestamp: Date.now()
      };
      const sRef = push(ref(db, `rooms/${currentRoomId}/stories`));
      updates[`rooms/${currentRoomId}/stories/${sRef.key}`] = {
        author: "SYSTEM",
        text: `🙋 [${currentUser.nickname}] 님이 소설 집필에 '끼어들기'를 신청했습니다! 동의 투표가 진행됩니다.`,
        isSystem: true,
        timestamp: Date.now()
      };
      update(ref(db), updates);
    });

    // 끼어들기 신청 실시간 감시 및 투표 알림
    onValue(ref(db, `rooms`), () => {
      if (!roomData || !roomData.interruptReq) return;
      const req = roomData.interruptReq;
      const activeWriters = (roomData.playerOrder || []).filter(id => !roomData.players[id]?.isBot);

      // 내가 아직 투표 안 한 활성 작가인 경우 팝업 컨펌
      if (activeWriters.includes(currentUser.id) && !req.votes?.[currentUser.id]) {
        const agree = confirm(`[끼어들기 요청] ${req.requesterName} 작가님이 소설 집필에 합류하고자 합니다. 동의하십니까?`);
        update(ref(db, `rooms/${currentRoomId}/interruptReq/votes/${currentUser.id}`), agree);
      }

      // 전원 동의 확인 (방장 기기에서 실행)
      if (roomData.hostId === currentUser.id && req.requesterId) {
        const votes = req.votes || {};
        const allAgreed = activeWriters.length > 0 && activeWriters.every(id => votes[id] === true);
        const hasRejection = activeWriters.some(id => votes[id] === false);

        if (allAgreed) {
          const newOrder = [...(roomData.playerOrder || []), req.requesterId];
          const updates = {};
          updates[`rooms/${currentRoomId}/players/${req.requesterId}/isSpectator`] = false;
          updates[`rooms/${currentRoomId}/playerOrder`] = newOrder;
          updates[`rooms/${currentRoomId}/interruptReq`] = null;

          const sRef = push(ref(db, `rooms/${currentRoomId}/stories`));
          updates[`rooms/${currentRoomId}/stories/${sRef.key}`] = {
            author: "SYSTEM",
            text: `🎉 전원 동의로 [${req.requesterName}] 님이 집필진에 정식 합류하였습니다!`,
            isSystem: true,
            timestamp: Date.now()
          };
          update(ref(db), updates);
        } else if (hasRejection) {
          update(ref(db, `rooms/${currentRoomId}/interruptReq`), null);
          const sRef = push(ref(db, `rooms/${currentRoomId}/stories`));
          set(sRef, {
            author: "SYSTEM",
            text: `❌ [${req.requesterName}] 님의 끼어들기 신청이 거절되었습니다.`,
            isSystem: true,
            timestamp: Date.now()
          });
        }
      }
    });

    // 8. 실시간 이모지 리액션 & 채팅
    document.querySelectorAll(".emoji-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        if (!currentRoomId) return;
        const emoji = btn.dataset.emoji;
        push(ref(db, `rooms/${currentRoomId}/reactions`), { emoji: emoji, uid: currentUser.id, time: Date.now() });
      });
    });

    // 리액션 실시간 팝업 감시
    let lastReactionTime = 0;
    onValue(ref(db, `rooms`), () => {
      if (!currentRoomId || !roomData?.reactions) return;
      const rList = Object.values(roomData.reactions);
      const latest = rList[rList.length - 1];
      if (latest && latest.time > lastReactionTime) {
        lastReactionTime = latest.time;
        showFloatingEmoji(latest.emoji);
      }
    });

    function showFloatingEmoji(emoji) {
      const el = document.createElement("div");
      el.className = "floating-emoji";
      el.textContent = emoji;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1500);
    }

    chatForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const txt = chatInput.value.trim();
      if (!txt || !currentRoomId) return;
      push(ref(db, `rooms/${currentRoomId}/chats`), {
        name: currentUser.nickname,
        text: txt,
        time: Date.now()
      });
      chatInput.value = "";
    });

    function renderChatFeed() {
      chatMessagesBox.innerHTML = "";
      const chats = roomData.chats || {};
      Object.values(chats).forEach(c => {
        const div = document.createElement("div");
        div.className = "chat-msg";
        div.innerHTML = `<strong>${escapeHtml(c.name)}:</strong>${escapeHtml(c.text)}`;
        chatMessagesBox.appendChild(div);
      });
      chatMessagesBox.scrollTop = chatMessagesBox.scrollHeight;
    }

    // 9. 실시간 LLM 작문
    function scheduleLiveLlmBotTurn(botId) {
      clearTimeout(botExecutionTimeout);
      const bot = roomData.players[botId];
      if (!bot) return;

      botExecutionTimeout = setTimeout(async () => {
        if (roomData.status !== "playing") return;
        const curTurnId = roomData.playerOrder[roomData.currentTurnIndex % roomData.playerOrder.length];
        if (curTurnId !== botId) return;

        const preset = BOT_PERSONAS[bot.persona] || BOT_PERSONAS.choding;
        const stories = roomData.stories || {};
        const allText = Object.values(stories).filter(s => !s.isSystem).map(s => s.text).join(" ");

        let generatedSentence = "";
        try {
          const userPrompt = `[전체 소설 줄거리]: "${allText || '시작'}"\n\n[지시사항]: 너는 '${preset.name}'이다. 지침: (${preset.instruction}). 지금까지의 전체 줄거리 맥락을 이어받아 다음 사건을 딱 '한 문장'만 한국어로 창작해라. 따옴표나 사족 없이 본문만 출력해라.`;
          const controller = new AbortController();
          const tId = setTimeout(() => controller.abort(), 8500);
          const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(userPrompt)}?seed=${Math.floor(Math.random()*100000)}`, { signal: controller.signal });
          clearTimeout(tId);
          if (res.ok) generatedSentence = cleanLlmText(await res.text());
        } catch (e) {}

        if (!generatedSentence || generatedSentence.length < 5) {
          generatedSentence = "순간 예상치 못한 정적이 감돌며 공기는 차갑게 얼어붙었다.";
        }

        if (roomData.status !== "playing") return;
        const now = Date.now();
        const turnStart = roomData.turnStartTime || now;
        const durationSec = Math.max(1, Math.floor((now - turnStart) / 1000));
        const nextIndex = (roomData.currentTurnIndex + 1) % roomData.playerOrder.length;

        const updates = {};
        const sRef = push(ref(db, `rooms/${currentRoomId}/stories`));
        updates[`rooms/${currentRoomId}/stories/${sRef.key}`] = {
          author: bot.name,
          text: generatedSentence,
          isSystem: false,
          isBot: true,
          durationStr: `${durationSec}초`,
          timestamp: now
        };
        updates[`rooms/${currentRoomId}/currentTurnIndex`] = nextIndex;
        updates[`rooms/${currentRoomId}/turnStartTime`] = now;
        update(ref(db), updates);
      }, 1800);
    }

    function cleanLlmText(text) {
      if (!text) return "";
      let c = text.replace(/^(문장:|답변:|소설:)/gi, "").trim();
      c = c.replace(/^["'“”‘]+|["'“”‘]+$/g, "").trim();
      return c.split("\n")[0].trim();
    }

    // 10. 턴 타이머 루프
    function runTurnTimerLoop(currentTurnId, hostId) {
      const isMyTurn = (currentTurnId === currentUser.id);
      const curWriter = roomData.players[currentTurnId];
      const isCurrentBot = curWriter?.isBot;

      novelTextInput.disabled = !isMyTurn;
      btnSubmitSentence.disabled = !isMyTurn;

      const wName = curWriter?.name || "익명";
      if (isMyTurn) turnMessage.innerHTML = `<span style="color:#2ed573; font-weight:bold;">내 차례</span>`;
      else turnMessage.textContent = `${wName} 작성 중${isCurrentBot ? ' (AI)' : ''}`;

      clearInterval(turnTimer);
      const mode = roomData.mode;
      const turnLimit = roomData.turnLimit;
      const totalLimitSec = (roomData.totalLimit || 5) * 60;
      const turnStart = roomData.turnStartTime || Date.now();
      const gameStart = roomData.gameStartTime || Date.now();

      turnTimer = setInterval(() => {
        const now = Date.now();
        if (mode === "timed") {
          const totalElapsed = Math.floor((now - gameStart) / 1000);
          const totalRem = totalLimitSec - totalElapsed;

          if (totalRem <= 0) {
            clearInterval(turnTimer);
            if (currentUser.id === hostId) triggerForceFinish();
            return;
          }

          const rem = turnLimit - Math.floor((now - turnStart) / 1000);
          const m = Math.floor(totalRem / 60);
          const s = totalRem % 60;
          if (rem > 0) timeLeftTag.textContent = `턴: ${rem}초 | 전체: ${m}분 ${s}초`;
          else {
            timeLeftTag.textContent = `턴 종료`;
            clearInterval(turnTimer);
            if (isMyTurn) handlePanicTimeout();
          }
        } else {
          const el = Math.floor((now - turnStart) / 1000);
          const m = Math.floor(el / 60);
          const s = el % 60;
          timeLeftTag.textContent = `소요 시간: ${m > 0 ? m + '분 ' : ''}${s}초`;
        }
      }, 1000);
    }

    function handlePanicTimeout() {
      document.body.classList.add("panic-alert");
      panicOverlay.style.display = "flex";
      if (panicTimeout) clearTimeout(panicTimeout);
      panicTimeout = setTimeout(() => {
        document.body.classList.remove("panic-alert");
        panicOverlay.style.display = "none";
      }, 3000);

      const curPen = (roomData.players[currentUser.id]?.penalties || 0) + 1;
      const nextIdx = (roomData.currentTurnIndex + 1) % roomData.playerOrder.length;
      const updates = {};
      updates[`rooms/${currentRoomId}/players/${currentUser.id}/penalties`] = curPen;
      updates[`rooms/${currentRoomId}/currentTurnIndex`] = nextIdx;
      updates[`rooms/${currentRoomId}/turnStartTime`] = Date.now();

      const sRef = push(ref(db, `rooms/${currentRoomId}/stories`));
      updates[`rooms/${currentRoomId}/stories/${sRef.key}`] = {
        author: "SYSTEM",
        text: `😱 [${currentUser.nickname}] 시간 초과! 경고 1회 적립 (누적 ${curPen}회)`,
        isSystem: true,
        timestamp: Date.now()
      };
      update(ref(db), updates);
    }

    function triggerForceFinish() {
      const updates = {};
      updates[`rooms/${currentRoomId}/status`] = "finished";
      const sRef = push(ref(db, `rooms/${currentRoomId}/stories`));
      updates[`rooms/${currentRoomId}/stories/${sRef.key}`] = {
        author: "SYSTEM",
        text: `⌛ 제한 시간 종료로 소설이 완결되었습니다.`,
        isSystem: true,
        timestamp: Date.now()
      };
      update(ref(db), updates);
    }

    novelInputForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const txt = novelTextInput.value.trim();
      if (!txt || roomData.status !== "playing") return;
      const curTurnId = roomData.playerOrder[roomData.currentTurnIndex % roomData.playerOrder.length];
      if (curTurnId !== currentUser.id) return;

      const now = Date.now();
      const turnStart = roomData.turnStartTime || now;
      const dur = Math.max(1, Math.floor((now - turnStart) / 1000));
      const durStr = dur >= 60 ? `${Math.floor(dur/60)}분 ${dur%60}초` : `${dur}초`;
      const nextIdx = (roomData.currentTurnIndex + 1) % roomData.playerOrder.length;

      const updates = {};
      const sRef = push(ref(db, `rooms/${currentRoomId}/stories`));
      updates[`rooms/${currentRoomId}/stories/${sRef.key}`] = {
        author: currentUser.nickname,
        authorId: currentUser.id,
        text: txt,
        isSystem: false,
        durationStr: durStr,
        timestamp: now
      };
      updates[`rooms/${currentRoomId}/currentTurnIndex`] = nextIdx;
      updates[`rooms/${currentRoomId}/turnStartTime`] = now;

      update(ref(db), updates).then(() => novelTextInput.value = "");
    });

    function renderStoryFeed() {
      storyScroll.innerHTML = "";
      const stories = roomData.stories || {};
      Object.values(stories).forEach(s => {
        const card = document.createElement("div");
        card.className = "novel-card";
        if (s.isSystem) card.classList.add("sys-card");
        if (s.isAiFirst) card.classList.add("ai-first");

        const tStr = s.timestamp ? new Date(s.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "";
        const durTag = s.durationStr ? `<span style="color:#2ed573;">(${s.durationStr})</span>` : "";

        card.innerHTML = `
          <div class="card-header">
            <strong>${escapeHtml(s.author)} ${durTag}</strong>
            <span>${tStr}</span>
          </div>
          <div style="font-size:0.95rem; line-height:1.6; color:#f1f2f6;">${escapeHtml(s.text)}</div>
        `;
        storyScroll.appendChild(card);
      });
      storyScroll.scrollTop = storyScroll.scrollHeight;
    }

    // 11. 소설 완결 및 도서관 게시 투표
    btnVoteFinish.addEventListener("click", () => {
      const curVote = roomData.finishVotes?.[currentUser.id] || false;
      const nextVote = !curVote;
      const activeWriters = (roomData.playerOrder || []).filter(id => roomData.players[id] && !roomData.players[id].isBot);

      const updates = {};
      updates[`rooms/${currentRoomId}/finishVotes/${currentUser.id}`] = nextVote;
      const nextVotes = { ...(roomData.finishVotes || {}), [currentUser.id]: nextVote };

      if (activeWriters.length > 0 && activeWriters.every(id => nextVotes[id] === true)) {
        updates[`rooms/${currentRoomId}/status`] = "finished";
      }
      update(ref(db), updates);
    });

    function openFinishDialog() {
      modalNovelEnd.style.display = "flex";
      clearInterval(turnTimer);
      clearTimeout(botExecutionTimeout);

      const stories = roomData.stories || {};
      const fullText = Object.values(stories).filter(s => !s.isSystem).map(s => `${s.text} (${s.author})`).join("\n\n");
      finalNovelBody.textContent = fullText || "작성된 내용이 없습니다.";

      const activeWriters = (roomData.playerOrder || []).filter(id => roomData.players[id] && !roomData.players[id].isBot);
      const pubVotes = roomData.publishVotes || {};
      const agreeCount = activeWriters.filter(id => pubVotes[id] === true).length;
      publishVoteStatus.textContent = `도서관 게시 찬성: ${agreeCount}/${activeWriters.length}명`;

      btnVotePublish.textContent = pubVotes[currentUser.id] ? "게시 찬성 취소" : "도서관 게시 찬성";
      btnVotePublish.style.background = pubVotes[currentUser.id] ? "#ff4757" : "#2ed573";
    }

    btnVotePublish.addEventListener("click", () => {
      const pubVotes = roomData.publishVotes || {};
      const nextVote = !pubVotes[currentUser.id];
      const activeWriters = (roomData.playerOrder || []).filter(id => roomData.players[id] && !roomData.players[id].isBot);

      const updates = {};
      updates[`rooms/${currentRoomId}/publishVotes/${currentUser.id}`] = nextVote;
      const nextVotes = { ...pubVotes, [currentUser.id]: nextVote };

      // 전원 찬성 시 공식 도서관(library/)에 게시
      if (activeWriters.length > 0 && activeWriters.every(id => nextVotes[id] === true)) {
        const stories = roomData.stories || {};
        const storyEntries = Object.values(stories).filter(s => !s.isSystem);
        const participantMap = {};
        storyEntries.forEach(s => {
          if (s.authorId) participantMap[s.authorId] = s.author;
        });

        const libRef = push(ref(db, "library"));
        updates[`library/${libRef.key}`] = {
          id: libRef.key,
          title: roomData.title,
          content: storyEntries.map(s => s.text).join("\n\n"),
          authors: participantMap,
          authorNames: Object.values(participantMap).join(", ") || "익명 작가진",
          publishedAt: Date.now()
        };
        alert("🎉 작가 전원의 찬성으로 소설이 도서관에 정식 출판되었습니다!");
      }
      update(ref(db), updates);
    });

    // 12. 도서관 목록 렌더링
    async function loadLibrary() {
      const snap = await get(ref(db, "library"));
      libraryContainer.innerHTML = "";
      if (!snap.exists()) {
        libraryContainer.innerHTML = `<p style="color:#666; font-size:0.85rem;">출판된 소설이 없습니다.</p>`;
        return;
      }
      const data = snap.val();
      Object.values(data).reverse().forEach(book => {
        const card = document.createElement("div");
        card.className = "library-card";
        const dateStr = new Date(book.publishedAt).toLocaleDateString();

        let authorSpans = Object.entries(book.authors || {}).map(([uId, name]) => {
          return `<span class="author-link" data-uid="${uId}">${escapeHtml(name)}</span>`;
        }).join(", ");
        if (!authorSpans) authorSpans = escapeHtml(book.authorNames);

        card.innerHTML = `
          <strong style="color:#2ed573; font-size:1.05rem;">${escapeHtml(book.title)}</strong>
          <div style="font-size:0.8rem; color:#888;">출판일: ${dateStr}</div>
          <div style="font-size:0.8rem; color:#aaa;">참여 작가: ${authorSpans}</div>
          <p style="font-size:0.85rem; color:#ccc; line-height:1.5; margin-top:6px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;">
            ${escapeHtml(book.content)}
          </p>
        `;

        card.querySelectorAll(".author-link").forEach(link => {
          link.addEventListener("click", (e) => {
            e.stopPropagation();
            loadProfile(link.dataset.uid);
            switchTab("profile");
          });
        });

        card.addEventListener("click", () => {
          alert(`[${book.title}]\n\n참여 작가: ${book.authorNames}\n\n${book.content}`);
        });

        libraryContainer.appendChild(card);
      });
    }

    // 13. 작가 프로필 로드
    async function loadProfile(targetUid) {
      const uid = targetUid || (currentUser ? currentUser.id : null);
      if (!uid) {
        profDisplayName.textContent = "로그인이 필요합니다.";
        profBioInput.value = "";
        btnSaveProfile.style.display = "none";
        profNovelList.innerHTML = `<p style="color:#666; font-size:0.85rem;">로그인 후 프로필을 확인할 수 있습니다.</p>`;
        return;
      }

      const uSnap = await get(ref(db, `users/${uid}`));
      if (!uSnap.exists()) return;
      const uData = uSnap.val();

      profDisplayName.textContent = `${uData.nickname} 작가 프로필`;
      profBioInput.value = uData.bio || "";
      btnSaveProfile.style.display = (currentUser && currentUser.id === uid) ? "inline-block" : "none";
      profBioInput.disabled = !(currentUser && currentUser.id === uid);

      // 참여 소설 목록 조회
      const libSnap = await get(ref(db, "library"));
      profNovelList.innerHTML = "";
      if (libSnap.exists()) {
        const books = Object.values(libSnap.val()).filter(b => b.authors && b.authors[uid]);
        if (books.length > 0) {
          books.forEach(b => {
            const div = document.createElement("div");
            div.className = "room-item";
            div.innerHTML = `
              <div>
                <strong>${escapeHtml(b.title)}</strong>
                <div style="font-size:0.8rem; color:#888;">${new Date(b.publishedAt).toLocaleDateString()} 출판</div>
              </div>
            `;
            profNovelList.appendChild(div);
          });
        } else {
          profNovelList.innerHTML = `<p style="color:#666; font-size:0.85rem;">출판된 참여작이 없습니다.</p>`;
        }
      }
    }

    btnSaveProfile.addEventListener("click", async () => {
      if (!currentUser) return;
      const newBio = profBioInput.value.trim();
      await update(ref(db, `users/${currentUser.id}`), { bio: newBio });
      currentUser.bio = newBio;
      localStorage.setItem("rnp_auth_user", JSON.stringify(currentUser));
      alert("소개글이 저장되었습니다!");
    });

    // 14. PDF 다운로드
    btnSavePdf.addEventListener("click", () => {
      const stories = roomData.stories || {};
      const paragraphs = Object.values(stories).filter(s => !s.isSystem).map(s => {
        const dur = s.durationStr ? ` <small style="color:#888;">(${s.durationStr})</small>` : "";
        return `<p style="margin-bottom:12px; line-height:1.7; font-size:11pt; color:#111;">${escapeHtml(s.text)} <small style="color:#666;">- ${escapeHtml(s.author)}${dur}</small></p>`;
      }).join("");

      const container = document.createElement("div");
      container.style.padding = "30px";
      container.style.fontFamily = "'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif";
      container.innerHTML = `
        <h1 style="text-align:center; font-size:20pt; color:#111; margin-bottom:8px;">${escapeHtml(roomData.title)}</h1>
        <p style="text-align:center; font-size:9pt; color:#666; margin-bottom:20px; border-bottom:2px solid #333; padding-bottom:8px;">
          작가진: ${Object.values(roomData.players || {}).map(p => escapeHtml(p.name)).join(", ")}
        </p>
        <div>${paragraphs}</div>
      `;
      html2pdf().set({
        margin: [15, 15, 15, 15],
        filename: `${roomData.title}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      }).from(container).save();
    });

    // 15. 퇴장 및 클린업
    function leaveRoom() {
      if (currentRoomId && currentUser) {
        remove(ref(db, `rooms/${currentRoomId}/players/${currentUser.id}`)).then(() => {
          const pRef = ref(db, `rooms/${currentRoomId}/players`);
          onValue(pRef, (snap) => {
            const players = snap.val() || {};
            const humanCount = Object.values(players).filter(p => !p.isBot).length;
            if (!snap.exists() || humanCount === 0) {
              remove(ref(db, `rooms/${currentRoomId}`));
            }
          }, { onlyOnce: true });
        });
      }
      cleanUpAndExit();
    }

    function cleanUpAndExit() {
      clearInterval(turnTimer);
      clearTimeout(botExecutionTimeout);
      currentRoomId = null;
      roomData = null;
      modalNovelEnd.style.display = "none";
      switchView("lobby");
      document.body.classList.remove("panic-alert");
      panicOverlay.style.display = "none";
    }

    btnExitRoom.addEventListener("click", leaveRoom);
    btnModalExit.addEventListener("click", leaveRoom);

    function escapeHtml(str) {
      if (!str) return "";
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
