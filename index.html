<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 릴레이 소설</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f8;
      color: #333;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 680px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      height: 90vh;
      overflow: hidden;
    }
    header {
      padding: 16px 20px;
      background-color: #24292f;
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
    }
    #story-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .sentence-card {
      background: #f9f9f9;
      border-left: 4px solid #0969da;
      padding: 10px 14px;
      border-radius: 4px;
      animation: fadeIn 0.3s ease-in-out;
    }
    .sentence-header {
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    .sentence-text {
      font-size: 1rem;
      line-height: 1.5;
      word-break: break-word;
    }
    #input-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 16px 20px;
      border-top: 1px solid #e1e4e8;
      background: #fafbfc;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    #author-input {
      width: 120px;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    #text-input {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    button {
      padding: 8px 16px;
      background-color: #2ea44f;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      align-self: flex-end;
    }
    button:hover {
      background-color: #2c974b;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>📖 실시간 릴레이 소설</header>
    <div id="story-box">
      <!-- 작성된 문장들이 실시간으로 추가됩니다 -->
    </div>
    <form id="input-form">
      <div class="input-row">
        <input type="text" id="author-input" placeholder="작성자 닉네임" required maxlength="12">
        <input type="text" id="text-input" placeholder="이어갈 다음 문장을 입력하세요..." required autocomplete="off">
      </div>
      <button type="submit">이어쓰기 등록</button>
    </form>
  </div>

  <!-- Firebase SDK 모듈 로드 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    // ⚠ Firebase 콘솔에서 발급받은 실제 키 값들로 변경해야 합니다.
    const firebaseConfig = {
      apiKey: "AIzaSyBsvhq6Y1KzvUJ9gUlF6_QEgYoj-FzuZMU",
      authDomain: "relaynovelphobia.firebaseapp.com",
      databaseURL: "https://relaynovelphobia-default-rtdb.firebaseio.com",
      projectId: "relaynovelphobia",
      storageBucket: "relaynovelphobia.firebasestorage.app",
      messagingSenderId: "365170091282",
      appId: "1:365170091282:web:6956889d54eea4070bbfcb"
    };

    // Firebase 초기화
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storyRef = ref(db, "relay_story");

    const storyBox = document.getElementById("story-box");
    const form = document.getElementById("input-form");
    const authorInput = document.getElementById("author-input");
    const textInput = document.getElementById("text-input");

    // 저장된 닉네임이 있다면 불러오기
    authorInput.value = localStorage.getItem("relay_author") || "";

    // 실시간 데이터 수신 (새 문장이 DB에 등록되면 모든 기기에 자동 반영)
    onChildAdded(storyRef, (snapshot) => {
      const data = snapshot.val();
      const card = document.createElement("div");
      card.className = "sentence-card";

      const dateText = data.timestamp ? new Date(data.timestamp).toLocaleTimeString() : "";

      card.innerHTML = `
        <div class="sentence-header">
          <strong>${escapeHtml(data.author)}</strong>
          <span>${dateText}</span>
        </div>
        <div class="sentence-text">${escapeHtml(data.text)}</div>
      `;
      storyBox.appendChild(card);
      storyBox.scrollTop = storyBox.scrollHeight;
    });

    // 문장 제출 시 DB에 실시간 저장
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const author = authorInput.value.trim();
      const text = textInput.value.trim();

      if (!author || !text) return;

      localStorage.setItem("relay_author", author);

      push(storyRef, {
        author: author,
        text: text,
        timestamp: serverTimestamp()
      }).then(() => {
        textInput.value = "";
        textInput.focus();
      }).catch((err) => {
        alert("저장에 실패했습니다: " + err.message);
      });
    });

    // XSS 방지용 함수
    function escapeHtml(string) {
      const div = document.createElement("div");
      div.innerText = string;
      return div.innerHTML;
    }
  </script>
</body>
</html>
